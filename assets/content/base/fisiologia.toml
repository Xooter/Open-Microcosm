# Fisiología por especie (MVP: validación científica). Cada valor como se publicó: valor, unidad,
# temperatura de la medición [°C] y fuente. El programa lo lleva a 20 °C con Q10 = 2.
#
# Unidades: "1/h" o "1/dia" (tasa), "h" o "dia" (tiempo de duplicación); para la alimentación por
# filtración, "bacterias/h" (ingestión máxima) y "nL/h", "uL/h" o "mL/h" (aclaramiento).
# estimacion = true: no es una medición directa en condiciones comparables (temperatura sin
# verificar, otra cepa u otro medio); la ficha lo dice. REVISAR antes de publicar resultados.
# Cada tabla es [id_del_ser.parametro] (el id de seres.toml). Las especies que no figuran usan el valor general del metabolismo (metabolismo.crecimiento_maximo).

version = 1

[paramecium.crecimiento_maximo]
# Ajuste logístico (r) al monocultivo de P. caudatum de la fig. 22 (datos digitalizados en el paquete
# de R gauseR, Clark et al.): r = 0,946 ± 0,109 /día, K = 203 (volumen relativo). La figura mide
# volumen, no individuos.
valor = 0.946
unidad = "1/dia"
temperatura = 26.0
fuente = "Gause, G. F. (1934). The Struggle for Existence. Williams & Wilkins, fig. 22 (P. caudatum en monocultivo). Temperatura del cultivo sin verificar (se asume 26 °C)."
estimacion = true

[paramecium.ingestion_maxima]
# Ingestión de bacterias en suspensión pura (Salmonella, de tamaño parecido a E. coli), por
# individuo. Un solo estudio en microcosmos; temperatura sin verificar (se asume la del laboratorio).
valor = 26000.0
unidad = "bacterias/h"
temperatura = 25.0
fuente = "Applied Water Science (2013), doi:10.1007/s13201-013-0130-1: P. caudatum ingiere ~26 x 10^3 bacterias por individuo y por hora en suspensión pura. Temperatura sin verificar (se asume 25 °C)."
estimacion = true

[paramecium.aclaramiento]
# Aclaramiento con POCAS presas (la pendiente inicial de la respuesta funcional de tipo II). No hay
# una medición directa para P. caudatum: se usa la escala general del zooplancton, ~10⁶ volúmenes
# corporales por día, que los ciliados superan 2 a 4 veces (Hansen, Bjørnsen y Hansen 1997, Limnol.
# Oceanogr. 42: 687-704; Kiørboe 2011, Biol. Rev. 86: 311-339): ~10⁵ por hora × 2,36·10⁵ µm³ (el
# esferoide de seres.toml). Consistente con el estudio de la ingestión: su aclaramiento medido,
# 106 nL/h, es a ~2,5·10⁸ bacterias/mL, donde con este valor la ingestión ya está saturada (×0,996),
# y a ~10⁶/mL cae a la mitad, como informa el mismo estudio para las concentraciones bajas.
valor = 23.6
unidad = "uL/h"
temperatura = 20.0
fuente = "Escala de volúmenes corporales (~10^5 por hora en ciliados; Hansen et al. 1997, Limnol. Oceanogr. 42: 687-704; Kiørboe 2011, Biol. Rev. 86: 311-339) con el volumen de P. caudatum. Medido a alta densidad: 106 nL/h a ~2,5·10^8 bacterias/mL (Applied Water Science 2013, doi:10.1007/s13201-013-0130-1)."
estimacion = true

