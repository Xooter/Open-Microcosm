# Reactivos del paquete de fábrica (fase P1, paso 11). El código aporta el mecanismo; los datos, sus
# parámetros medidos con fuente. La CI50 y la CIM salen de un experimento de dosis-respuesta: la CIM
# publicada (`cim_publicada`) sirve para validar la que emerge, no la usa la simulación.
#
# [[reactivo]]: id, nombre, descripcion, mecanismo ("farmacodinamico": Regoes et al. 2004), blancos
#   (por ahora "bacterias"), depende_del_crecimiento (la muerte escala con lo que crece la bacteria),
#   difusion [µm²/s]; [reactivo.farmacodinamia] psi_max y psi_min [1/h], zmic [µg/mL], kappa, fuente;
#   [reactivo.cim_publicada] valor [µg/mL], fuente.

[[reactivo]]
id = "ampicilina"
nombre = "Ampicilina"
descripcion = "Penicilina de amplio espectro (beta-lactamico): se une a las enzimas que arman el peptidoglicano y la pared se rompe mientras la bacteria crece. A una bacteria que no crece no la mata. Los eucariotas no tienen esa pared."
mecanismo = "farmacodinamico"
blancos = ["bacterias"]
depende_del_crecimiento = true
difusion = 600.0
[reactivo.farmacodinamia]
psi_max = 0.75
psi_min = -4.0
zmic = 3.4
kappa = 0.75
fuente = "Regoes, R. R. et al. (2004). Antimicrob. Agents Chemother. 48: 3670-3676, tabla 1 (E. coli O18:K1:H7, curvas de muerte): psi_max 0,75/h, psi_min -4,0/h, kappa 0,75, zMIC 3,4 ug/mL."
[reactivo.cim_publicada]
valor = 8.0
fuente = "Regoes et al. (2004), tabla 1: CIM 8 ug/mL por dilución al doble (la misma cepa)."

[[reactivo]]
id = "tetraciclina"
nombre = "Tetraciclina"
descripcion = "Se une a la subunidad 30S del ribosoma bacteriano (70S) e impide la sintesis de proteinas. Los ribosomas 80S de los eucariotas casi no la unen."
mecanismo = "farmacodinamico"
blancos = ["bacterias"]
depende_del_crecimiento = true
difusion = 500.0
[reactivo.farmacodinamia]
psi_max = 0.81
psi_min = -8.1
zmic = 0.67
kappa = 0.61
fuente = "Regoes, R. R. et al. (2004). Antimicrob. Agents Chemother. 48: 3670-3676, tabla 1 (E. coli O18:K1:H7): psi_max 0,81/h, psi_min -8,1/h, kappa 0,61, zMIC 0,67 ug/mL."
[reactivo.cim_publicada]
valor = 1.0
fuente = "Regoes et al. (2004), tabla 1: CIM 1 ug/mL por dilución al doble."
