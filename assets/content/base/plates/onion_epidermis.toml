[[plate]]
id = "onion_epidermis"
legacy_ids = ["epidermis_cebolla"]
name = "Preparado: epidermis de cebolla morada"
description = "La epidermis interna de una escama de cebolla morada montada en agua: celulas alargadas con pared y una vacuola violeta. Agregando sal (Ambiente > Salinidad, unos 30 g/kg) el protoplasto pierde agua y se despega de la pared: plasmolisis. En agua vuelve (deplasmolisis). Se simula un campo de 1 mm: el anillo marca su borde."
