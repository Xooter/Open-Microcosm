# Paquete de fábrica de BioGame (fase 20.0). Un paquete es una carpeta con archivos TOML (o un
# solo archivo .biopack con todo adentro): seres, minerales, medios, biomas y placas preparadas.
[pack]
id = "base"
name = "BioGame: contenido de fábrica"
version = "1"
author = "BioGame"
license = "GPL-3.0-or-later"

# Orden de carga de cada carpeta (los índices de los seres, biomas y minerales
# de fábrica son el orden de carga). Lo que no está listado se carga después, por nombre.
[pack.order]
body_plans = ["ciliate", "euglenid", "amoeba", "flagellate_chlorophyte", "cryptophyte", "colorless_euglenid", "dinoflagellate", "green_alga", "diatom", "yeast", "parabasalid", "adherent_human_cell", "neutrophil", "plant_cell", "plant_cell_chloroplasts", "squamous_cell", "leukocyte", "choanoflagellate", "spermatozoon"]
minerals = ["clay", "quartz", "mica", "iron_oxide", "sulfur", "frustule"]
beings = ["paramecium", "euglena", "amoeba", "chlamydomonas", "didinium", "vorticella", "stentor", "podophrya", "euplotes", "arcella", "lacrymaria", "spirogyra", "navicula", "volvox", "pediastrum", "candida", "naegleria", "trichonympha", "mougeotia", "zygnema", "oedogonium", "paramecium_aurelia", "asterionella", "cyclotella", "human_dermal_fibroblast", "hela", "neutrophil", "onion_epidermal_cell", "elodea_leaf_cell", "buccal_squamous_cell", "lymphocyte", "monocyte", "tetrahymena", "colpidium", "saccharomyces", "chlorella", "raphidocelis", "desmodesmus", "phacus", "pinnularia", "gonium", "pandorina", "eudorina", "stylonychia", "frontonia", "tokophrya", "cryptomonas", "coleps", "blepharisma", "colpoda", "chilodonella", "litonotus", "acineta", "peranema", "trachelomonas", "haematococcus", "ceratium", "chaos", "euglypha", "closterium", "cosmarium", "micrasterias", "gomphonema", "nih_3t3", "hacat", "halteria", "epistylis", "ulothrix", "phaeodactylum", "thalassiosira", "fragilariopsis", "polarella", "staurastrum", "peridinium", "dileptus", "lembadion", "euplotes_octocarinatus", "tetrahymena_vorax", "ochromonas", "actinophrys", "vampyrella", "salpingoeca", "lingulodinium", "paramecium_bursaria", "mesodinium", "paramecium_tetraurelia", "zoothamnium", "carchesium", "bacillaria", "acanthamoeba", "dictyostelium", "human_sperm"]
biomes = ["puddle", "pond", "moss", "termite_gut", "hot_spring", "sea_ice"]
media = ["dmem_high_glucose", "distilled_water", "saline_0_9", "osterhout_gause", "wc_guillard", "mueller_hinton", "seminal_plasma", "hos_solution"]
vessels = ["dish_35mm", "dish_60mm", "dish_100mm", "well_6", "well_24", "well_96", "flask_t25", "slide", "gause_tube", "erlenmeyer_250", "test_tube_10", "microchemostat"]
plates = ["dmem_culture", "onion_epidermis", "elodea_leaf", "potato_lugol", "onion_root_tip", "leaf_epidermis", "buccal_mucosa", "blood_smear", "live_blood", "fresh_semen", "semen_eosin_nigrosin", "semen_hos"]
lessons = ["jennings_co2", "onion_plasmolysis", "osmotic_fragility", "gause_competition", "tilman_chemostat", "spermiogram"]
reagents = ["ampicillin", "tetracycline"]
glossary = ["reynolds_number", "chemotaxis", "phototaxis", "avoidance_reaction", "redfield", "liebig", "monod", "chemostat", "r_star", "competitive_exclusion", "q10", "functional_response", "clearance", "osmosis", "plasmolysis", "hemolysis", "contractile_vacuole", "food_vacuole", "phagocytosis", "cytostome", "conjugation", "mitosis", "cyst", "biofilm", "quorum", "phage", "mic", "ic50", "beer_lambert", "henry_law", "ph", "respiration", "fermentation", "photosynthesis", "heterocyst", "auxotrophy", "contact_inhibition", "restriction_point", "apoptosis", "warburg", "gram", "brightfield", "spermatozoon", "acrosome", "casa", "motility", "capacitation"]
