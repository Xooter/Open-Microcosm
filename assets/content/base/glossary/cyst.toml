[[term]]
id = "cyst"
term = "Quiste"
definition = "Estado de resistencia: la célula se redondea, arma una pared gruesa y casi detiene el metabolismo hasta que vuelven las condiciones buenas (comida, agua, temperatura)."
source = "Corliss, J. O. & Esser, S. C. (1974). Comments on the role of the cyst in the life cycle and survival of free-living protozoa. Trans. Am. Microsc. Soc. 93: 578-593."
alias = ["quistes", "enquistamiento", "enquistado", "enquistada"]
