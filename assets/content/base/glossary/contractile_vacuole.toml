[[term]]
id = "contractile_vacuole"
term = "Vacuola contráctil"
definition = "Organelo de los protistas de agua dulce que junta el agua que entra por ósmosis y la expulsa al exterior cada pocos segundos. Sin ella, la célula se hincharía hasta reventar."
source = "Allen, R. D. (2000). The contractile vacuole and its membrane dynamics. BioEssays 22: 1035-1042."
alias = ["vacuolas contráctiles"]
related = ["osmosis"]
