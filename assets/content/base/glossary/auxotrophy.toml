[[term]]
id = "auxotrophy"
term = "Auxotrofía"
definition = "Necesidad de recibir hecho un compuesto que la célula no puede fabricar. Muchas algas (Euglena, diatomeas) necesitan vitamina B₁₂, que solo hacen las bacterias."
source = "Croft, M. T. et al. (2005). Algae acquire vitamin B12 through a symbiotic relationship with bacteria. Nature 438: 90-93."
alias = ["auxótrofa", "auxótrofas", "auxótrofo", "vitamina b₁₂", "b₁₂"]
