[[term]]
id = "apoptosis"
term = "Apoptosis"
definition = "Muerte celular programada: la célula se encoge, condensa la cromatina y se fragmenta en cuerpos apoptóticos sin derramar su contenido (no hay lisis ni inflamación)."
source = "Kerr, J. F. R., Wyllie, A. H. & Currie, A. R. (1972). Apoptosis: a basic biological phenomenon. Br. J. Cancer 26: 239-257."
alias = ["apoptótico", "apoptóticos", "cuerpos apoptóticos"]
