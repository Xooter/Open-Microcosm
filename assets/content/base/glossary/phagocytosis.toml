[[term]]
id = "phagocytosis"
term = "Fagocitosis"
definition = "Ingestión de una partícula grande (una bacteria, otra célula) envolviéndola con la membrana hasta cerrar una vacuola. La hacen las amebas para comer y los neutrófilos para defender."
source = "Alberts, B. et al. (2015). Molecular Biology of the Cell, 6.ª ed. Garland Science, cap. 13."
alias = ["fagocita", "fagocitan", "fagocitar", "fagocitada", "fagocitado"]
related = ["food_vacuole"]
