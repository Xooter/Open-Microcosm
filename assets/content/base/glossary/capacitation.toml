[[term]]
id = "capacitation"
term = "Capacitación"
definition = "Cambios que el espermatozoide sufre en el tracto femenino (o en un medio con bicarbonato y albúmina a 37 °C) durante horas: la albúmina le saca colesterol a la membrana, el bicarbonato activa la adenilato ciclasa soluble y suben el pH y el calcio (canal CatSper). Solo capacitado puede hiperactivarse y hacer la reacción acrosómica."
source = "Visconti, P. E. et al. (2011). Asian J. Androl. 13: 395."
alias = ["capacitado", "capacitados", "hiperactivación", "hiperactivado", "hiperactivados"]
related = ["acrosome", "motility"]
