[[term]]
id = "phage"
term = "Fago lítico"
definition = "Virus de bacterias que entra, se multiplica y rompe la bacteria liberando decenas a cientos de fagos nuevos. Las bacterias resistentes aparecen por mutación del receptor."
source = "Abedon, S. T. (2009). Phage evolution and ecology. Adv. Appl. Microbiol. 67: 1-45."
alias = ["fagos", "bacteriófago", "bacteriófagos", "fagos líticos"]
