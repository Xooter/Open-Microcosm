# Desmodesmus subspicatus (Scenedesmus subspicatus): la otra alga del ensayo OECD 201. En la naturaleza
# forma cenobios de 4 células; la cepa de laboratorio crece casi siempre como células sueltas ovales de
# 7–15 × 3–12 µm y 60–80 µm³ (OECD 201, anexo 2). Autosporas. Espesor para el volumen medido.
