# Peranema trichophorum: euglenoide incoloro y fagótrofo de 22–81 µm (metabólico; Kreutz), con un
# flagelo grueso hacia adelante del que solo bate la punta (se desliza) y un aparato de ingestión de
# dos varillas con el que traga Euglena, levaduras y algas enteras. Ancho estimado (~40 %).
[[being]]
id = "peranema"
name = "Peranema"
tags = ["protist", "flagellate", "euglenid"]
description = "Euglenoide incoloro de ~50 um que avanza deslizandose con un flagelo grueso y traga presas enteras, como Euglena y levaduras, con dos varillas de su aparato de ingestion."
locomotion = "flagellum"
body_plan = "colorless_euglenid"
feeding = "raptorial"
relative_speed = 0.4
prey = ["euglena", "chlamydomonas", "cryptomonas", "candida", "saccharomyces", "chlorella"]
initial_count = 4
handling_hours = 1.0
cyclosis = 1.0
ph = [5.0, 9.5]
temperature = [5.0, 32.0]
storage = "paramylon"
wall = "none"
genome = { chloroplasts = 0.0 }
[being.shape]
semi_major_axis = 25.0
semi_minor_axis = 10.0
shape_memory = 2.0
color = [200, 198, 184]
nucleus = 0.3
taper = 0.4
