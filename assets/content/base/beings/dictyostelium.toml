# Dictyostelium discoideum: ameba social del suelo del bosque, de ~10 µm. Con bacterias come y se divide
# (~4 h por generación sobre bacterias; Sussman 1987, Methods Cell Biol. 28: 9, a verificar). Con hambre,
# en unas horas se vuelve competente: algunas células disparan pulsos de AMPc cada ~6 min, las vecinas los
# relevan (sueltan su pulso y quedan refractarias unos minutos) y se mueven hacia el frente de la onda;
# las ondas en espiral o concéntricas juntan a las células en corrientes hacia un centro (Konijn et al.
# 1967; Tomchik & Devreotes 1981, Science 212: 443; Martiel & Goldbeter 1987, Biophys. J. 52: 807). El
# AMPc difunde (D ≈ 400 µm²/s, Dworkin & Keller 1977) y la fosfodiesterasa lo degrada en ~1 min. Acá se
# simula hasta las corrientes de agregación: el montículo, la babosa y el cuerpo fructífero son
# multicelulares. Migración en tiempo biológico (~15 µm/min). Umbral, pulso y fracción de marcapasos:
# órdenes de magnitud.
