tags = ["protist", "amoeboid", "bacterivore", "social_amoeba"]
description = "Ameba social de ~10 um. Cuando se queda sin bacterias, se comunica con pulsos de AMPc que se propagan en ondas y miles de amebas se juntan en corrientes hacia un centro."
locomotion = "pseudopod"
body_plan = "amoeba"
feeding = "phagocytosis"
relative_speed = 2.5
initial_count = 12
