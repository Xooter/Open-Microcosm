source = "HaCaT aisladas en 2D: 63 ± 15 µm/h (46 en grupos y 32 confluentes; PLoS ONE 2012, doi 10.1371/journal.pone.0031711, tabla 2). La asignación de los valores a cada patrón está por verificar."
estimate = true

