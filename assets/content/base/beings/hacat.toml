# HaCaT: queratinocitos humanos inmortalizados espontáneamente (Boukamp et al. 1988, J. Cell Biol.
# 106: 761). Epiteliales, poligonales, de 20–25 µm redondeados (hoja de datos de Cytion); acá extendidos
# a ~40 µm. Crecen en islotes y se diferencian en la confluencia.
[[being]]
id = "hacat"
name = "Queratinocito HaCaT"
tags = ["human_cell", "animal_cell", "keratinocyte"]
description = "Linea de queratinocitos humanos (las celulas de la epidermis). Poligonales, crecen en islotes que se unen hasta cubrir la placa; se usan para estudiar el cierre de heridas."
body_plan = "adherent_human_cell"
locomotion = "crawl"
feeding = "none"
relative_dry_mass = 0.205
ph = [6.8, 7.8]
temperature = [30.0, 40.0]
max_salinity = 16.0
storage = "glycogen"
wall = "none"
[being.shape]
semi_major_axis = 20.0
semi_minor_axis = 18.0
shape_memory = 2.0
color = [214, 208, 196]
nucleus = 0.5
squareness = 3.0
[being.cell]
adherent = true
rounded_radius = 11.0
contact_inhibition_locomotion = true
contact_inhibition_proliferation = true
min_serum = 0.01
[being.appearance]
style = "adherent_cell"

[physiology.hacat.max_growth]
value = 28.0
unit = "h"
temperature = 37.0
source = "Cellosaurus CVCL_0038 (HaCaT): tiempo de duplicación 28 h."
estimate = true

[physiology.hacat.phase_g1]
value = 15.0
unit = "h"
temperature = 37.0
source = "Completa la duplicación de ~28 h con S, G2 y M de la célula humana típica (Alberts et al., MBoC 6ª ed., fig. 17-4)."
estimate = true

