# Paramecium tetraurelia killer (cepa 51): del complejo P. aurelia, ~120 × 40 µm. Lleva en el citoplasma
# bacterias endosimbiontes Caedibacter taeniospiralis (partículas kappa); las que forman cuerpos R (cintas
# enrolladas) salen al agua y matan a los paramecios sensibles que las comen, que se vacuolizan y mueren
# en horas; los killer son inmunes (Sonneborn 1938; Preer, Preer & Jurand 1974, Bacteriol. Rev. 38: 113).
# Los cuerpos R son partículas (difunden muy poco) que persisten días. Tasa de liberación, difusión y vida
# media: órdenes de magnitud, a verificar. La toxicidad para los sensibles está en P. aurelia.
[[being]]
id = "paramecium_tetraurelia"
name = "Paramecium tetraurelia (killer)"
tags = ["protist", "ciliate", "bacterivore"]
description = "Paramecio 'killer': sus bacterias endosimbiontes sueltan cuerpos R al agua que matan a los paramecios sensibles que los comen."
locomotion = "cilia"
# Nada en hélice girando sobre su eje (vista desde arriba, una oscilación lateral): radio y período
# estimados, del orden de los de Bullington 1925 y Jennings 1906, a verificar.
helix_radius = 10.0
helix_period = 0.8
body_plan = "ciliate"
feeding = "oral_groove"
flees_from = ["didinium", "lacrymaria"]
conjugation = true
chemokinesis = true
acid_trap = true
initial_count = 0
cyclosis = 4.0
ph = [6.0, 9.5]
temperature = [5.0, 35.0]
storage = "glycogen"
wall = "none"
[being.shape]
semi_major_axis = 60.0
semi_minor_axis = 20.0
shape_memory = 8.0
color = [168, 176, 146]
nucleus = 0.32

# Zapatilla: el surco oral hunde un lado, desde el tercio anterior hasta la boca, en la mitad del
# cuerpo. Profundidad y largo estimados.
[[being.process]]
kind = "notch"
at = 54.0
length = 4.0
base_width = 28.0
tip_width = 14.0
fillet = 7.0

# Se reparten en tiempo biológico (como su liberación y su degradación): el largo del área afectada es el real.
[being.release]
signal = "kappa_r_bodies"
rate = 0.001
diffusion = 1.0
half_life_hours = 72.0
bio_time = true

[physiology.paramecium_tetraurelia.max_growth]
# Sin medición de la cepa: estimación alométrica ln r = 1,52 ln T − 0,27 ln V − 1,44 (r en 1/día, T en °C,
# V en µm³) a 20 °C, con el volumen del esferoide de [being.shape] (semiejes 60, 20 y 20 µm: 100531 µm³).
value = 1.00
unit = "1/day"
temperature = 20.0
source = "Estimación alométrica con la regresión de Müller, H. & Geller, W. (1993). Maximum growth rates of aquatic ciliated protozoa: the dependence on body size and temperature reconsidered. Arch. Hydrobiol. 126: 315-327 (r a 20 °C para un ciliado de 100531 µm³). No es una medición de la especie."
estimate = true

# Vacuola contráctil: se llena con el agua que entra por ósmosis y se vacía de golpe. Período en agua
# dulce estimado; osmolaridad del citosol del orden de la de Paramecium (~60 mOsm; Stock et al. 2002), a
# verificar para la especie.
[being.contractile_vacuole]
period_s = 8.0
cytosol_mosm = 60.0
