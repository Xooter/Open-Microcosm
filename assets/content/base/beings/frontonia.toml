# Frontonia leucas: ciliado ovalado de ~250 µm (Foissner; 173–335 µm según la población, Serra et al.
# 2021, BMC Zool. 6: 4) con tricocistos, que traga diatomeas, flagelados y trozos de algas enteros.
# Ancho estimado (~55 % del largo, por las figuras). Come también desmidias; la boca (citostoma dilatado)
# se estima en ~la mitad del ancho del cuerpo (70 µm): traga un Cosmarium (~66 µm) pero no un
# Staurastrum, cuyos brazos lo hacen más ancho (la defensa de las prolongaciones).
[[being]]
id = "frontonia"
name = "Frontonia"
tags = ["protist", "ciliate"]
description = "Ciliado grande (~250 um) y ovalado que traga diatomeas y algas enteras: suele verse lleno de vacuolas pardas y verdes."
locomotion = "cilia"
# Nada en hélice girando sobre su eje (vista desde arriba, una oscilación lateral): radio y período
# estimados, del orden de los de Bullington 1925 y Jennings 1906, a verificar.
helix_radius = 15.0
helix_period = 1.5
body_plan = "ciliate"
feeding = "raptorial"
relative_speed = 0.5
prey = ["navicula", "pinnularia", "asterionella", "cyclotella", "chlamydomonas", "euglena", "phacus", "cryptomonas", "chlorella", "cosmarium", "closterium", "staurastrum"]
mouth_width = 70.0
conjugation = true
initial_count = 2
handling_hours = 1.0
cyclosis = 2.0
ph = [6.0, 9.5]
temperature = [5.0, 30.0]
storage = "glycogen"
wall = "none"
[being.shape]
semi_major_axis = 125.0
semi_minor_axis = 69.0
shape_memory = 8.0
color = [172, 176, 150]
nucleus = 0.25

# Vacuola contráctil: se llena con el agua que entra por ósmosis y se vacía de golpe. Período en agua
# dulce estimado; osmolaridad del citosol del orden de la de Paramecium (~60 mOsm; Stock et al. 2002), a
# verificar para la especie.
[being.contractile_vacuole]
period_s = 15.0
cytosol_mosm = 60.0
