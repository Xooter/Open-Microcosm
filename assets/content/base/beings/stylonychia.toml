# Stylonychia mytilus: hipotrico grande y rígido, ~300 µm (en ayunas; Shi & Ammermann 2004,
# Protistology 3: 219), que camina con sus cirros y come algas, flagelados y diatomeas con un
# peristoma de la mitad de su largo. Ancho: la proporción de S. harbinensis del mismo trabajo
# (142 × 58 µm). Aplanado dorsoventralmente (espesor estimado).
[[being]]
id = "stylonychia"
name = "Stylonychia"
tags = ["protist", "ciliate"]
description = "Ciliado hipotrico grande (~300 um), rigido y chato, que camina y salta sobre el vidrio con sus cirros. Come algas, flagelados y diatomeas."
locomotion = "cilia"
body_plan = "ciliate"
feeding = "oral_groove"
relative_speed = 0.25
mouth_prey = ["chlamydomonas", "chlorella", "cryptomonas", "navicula", "raphidocelis", "desmodesmus", "euglena"]
conjugation = true
initial_count = 3
walks = true
handling_hours = 1.0
cyclosis = 2.0
ph = [6.0, 9.5]
temperature = [5.0, 30.0]
storage = "glycogen"
wall = "none"
genome = { trichocysts = 0.0 }
[being.shape]
semi_major_axis = 150.0
semi_minor_axis = 61.0
thickness = 20.0
shape_memory = 10.0
# Contorno de lados casi paralelos y extremos redondeados (Kreutz; estimado).
squareness = 2.6
color = [180, 178, 160]
nucleus = 0.25

[being.appearance]
style = "cirri"


[physiology.stylonychia.max_growth]
# Ciclo celular de S. mytilus y S. lemnae en el laboratorio; la especie nueva del trabajo se divide cada
# 9 h a temperatura ambiente (21 °C), y el texto da las 12 h de S. mytilus para comparar (se asume la
# misma temperatura).
value = 12.0
unit = "h"
temperature = 21.0
source = "Shi, X. & Ammermann, D. (2004). Stylonychia harbinensis sp. n., a new oxytrichid ciliate (Ciliophora, Hypotrichia) from the Heilongjiang Province, China. Protistology 3: 219-222: el ciclo celular de S. mytilus y S. lemnae dura 12 h. Temperatura sin verificar (la del trabajo, 21 °C)."
estimate = true
