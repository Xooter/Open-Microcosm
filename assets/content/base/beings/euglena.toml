# Euglena gracilis: ~50 × 14 µm, mixótrofa con cloroplastos y estigma.

[[being]]
id = "euglena"
name = "Euglena"
tags = ["protist", "flagellate", "euglenid", "phototroph"]
description = "Flagelado verde con mancha ocular: nada hacia la luz y hace fotosintesis, pero tambien absorbe comida."
locomotion = "flagellum"
# Nada en hélice girando sobre su eje (vista desde arriba, una oscilación lateral): radio y período
# estimados, a verificar.
helix_radius = 5.0
helix_period = 1.0
body_plan = "euglenid"
feeding = "anterior_pole"
flees_from = ["lacrymaria"]
phototaxis = true
initial_count = 20
chloroplasts = true
b12_auxotroph = true
cyclosis = 1.0
ph = [3.0, 9.5]
temperature = [10.0, 35.0]
storage = "paramylon"
wall = "none"
[being.shape]
semi_major_axis = 25.0
semi_minor_axis = 7.0
shape_memory = 4.0
# Huso: el polo anterior romo (con el reservorio y el flagelo) y la cola aguzada (Kreutz; estimado).
taper = 0.5
color = [120, 172, 92]
nucleus = 0.32

# Respuesta fotofóbica: con luz ya intensa, un aumento brusco la hace detenerse, girar y salir en otra
# dirección (Diehn 1973, Science 181: 1009). Con la fototaxis, eso la deja en la luz moderada. Umbrales
# relativos a la lámpara, estimados.
# Metabolia (movimiento euglenoide): la película de bandas helicoidales se desliza y una onda de
# ensanchamiento corre del polo anterior al posterior; mientras, no avanza. Se ve sobre todo en células
# frenadas o apretadas (Arroyo, Heltai, Millán & DeSimone 2012, PNAS 109: 17874). Amplitud y período del
# orden de esas figuras; frecuencia y duración de los episodios: estimadas.
[being.shape_wave]
kind = "metaboly"
amplitude = 0.6
period_s = 10.0
wavelength = 1.0
episodes_per_min = 0.5
episode_s = 20.0

[[being.response]]
field = "light"
kind = "step_up"
threshold = 0.15
min_level = 0.7
memory = 1.0
refractory = 2.0
action = "avoid"

[physiology.euglena.max_growth]
# Medio con digerido de fermentación metánica al 10 % (no es un medio estándar).
value = 0.047
unit = "1/h"
temperature = 30.0
source = "Cultivo de E. gracilis en digerido de fermentación metánica (10 %), 150 µmol m⁻² s⁻¹: µmax 0,047/h a 30 °C."
estimate = true
