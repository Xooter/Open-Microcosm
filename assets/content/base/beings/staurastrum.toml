# Staurastrum anatinum: desmidia planctónica de 3 o 4 radios. Vista desde un polo (vista apical) es una
# estrella de tres brazos; mide 34–96 µm de largo y 48–125 µm de ancho con los brazos, que llevan hileras
# de gránulos espinosos y cuyo largo varía mucho según el ambiente (Kreutz, realmicrolife.com). Acá, en
# vista apical: un cuerpo de ~26 µm y tres brazos de ~34 µm a 120° (~95 µm de punta a punta).
[[being]]
id = "staurastrum"
name = "Staurastrum"
tags = ["alga", "green_alga", "desmid", "phototroph", "chytrid_host"]
description = "Desmidia planctonica que, vista desde un polo, es una estrella de tres brazos largos (~95 um de punta a punta). Los brazos la frenan al hundirse en el agua."
locomotion = "cilia"
body_plan = "green_alga"
relative_speed = 0.0
relative_photosynthesis = 1.3
initial_count = 3
chloroplasts = true
ph = [5.0, 9.0]
temperature = [2.0, 28.0]
storage = "starch"
wall = "cellulose"
genome = { chloroplasts = 1.0, trichocysts = 0.0 }
[being.shape]
semi_major_axis = 13.0
semi_minor_axis = 12.0
shape_memory = 30.0
color = [138, 182, 112]
nucleus = 0.25

# Tres brazos de la pared a 120° (vista apical), con el largo medio del diagnóstico.
[[being.process]]
kind = "arm"
at = 0.0
length = 34.0
base_width = 8.0
tip_width = 3.0
count = 3

[being.appearance]
style = "coccoid"
