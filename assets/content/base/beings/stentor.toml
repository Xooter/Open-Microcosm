# Stentor coeruleus: trompeta azul (pigmento stentorina), extendida hasta ~1 mm; aquí una
# contraída de ~200 µm. Se fija por el pie; su corriente oral trae bacterias y algas chicas.
# Contracción: al tocarla, ante una corriente brusca o un aumento brusco de luz (la stentorina es su
# fotorreceptor; Song 1981), los mionemas la acortan entera en milisegundos y se re-extiende en unos
# segundos (Newman 1972, J. Cell Biol. 52: 115; habituación: Wood 1970, Dexter et al. 2019).
# Contraída es una pera casi esférica; fija y extendida, una trompeta: el disco oral ancho con la banda
# de membranelas, el cuerpo cónico y el extremo posterior fino como un pedúnculo (es la misma célula)
# que termina en el pie. Suelta, nada en forma de pera (Tartar 1961, The Biology of Stentor). El ancho
# de la boca sale de conservar el volumen. Largo extendido, ancho del pie, tiempo de re-extensión,
# contracciones espontáneas y umbrales: estimados, a verificar en Tartar 1961 y Wood 1970.

[[being]]
id = "stentor"
name = "Stentor"
tags = ["protist", "ciliate", "bacterivore"]
description = "Trompeta azul fija por el pie; su corona de membranelas crea un remolino que trae bacterias y algas."
locomotion = "cilia"
conjugation = true
body_plan = "ciliate"
feeding = "oral_groove"
relative_speed = 0.5
mouth_prey = ["euglena", "chlamydomonas", "navicula", "asterionella", "cyclotella", "chlorella", "raphidocelis", "desmodesmus", "cryptomonas"]
initial_count = 2
handling_hours = 0.5
cyclosis = 3.0
ph = [6.0, 9.5]
temperature = [5.0, 28.0]
storage = "glycogen"
wall = "none"
genome = { trichocysts = 0.0 }
[being.shape]
semi_major_axis = 100.0
semi_minor_axis = 80.0
shape_memory = 6.0
color = [120, 150, 200]
nucleus = 0.32
taper = 0.5

[being.appearance]
style = "membranelle_crown"

[being.contraction]
extension = 3.0
extension_s = 15.0
profile = "trumpet"
foot_width = 0.1
swimming_extension = 0.3
spontaneous_per_min = 0.2

[[being.response]]
field = "touch"
kind = "above"
threshold = 0.5
action = "contract"
refractory = 2.0

[[being.response]]
field = "shear"
kind = "above"
threshold = 2.0
action = "contract"
refractory = 2.0

[[being.response]]
field = "light"
kind = "step_up"
threshold = 0.3
min_level = 0.3
memory = 2.0
action = "contract"
refractory = 5.0

# Sin tallo: se fija al vidrio por el pie (una secreción adhesiva y seudópodos del polo posterior) y,
# con hambre, lo suelta, nada y se vuelve a fijar (Tartar 1961, The Biology of Stentor).
[being.stalk]
kind = "foot"
detaches = true
