# Vorticella campanula: campana de ~80 µm sobre un tallo de ~150 µm con espasmonema (se
# contrae en ~10 ms, el movimiento más rápido conocido en una célula). Filtra bacterias con
# la corona ciliar del peristoma. Al dividirse, una hija nada como telotroco y se fija.

[[being]]
id = "vorticella"
name = "Vorticella"
tags = ["protist", "ciliate", "bacterivore"]
description = "Campana sobre un tallo con un resorte (espasmonema): se contrae en milisegundos ante cualquier susto."
locomotion = "cilia"
conjugation = true
body_plan = "ciliate"
feeding = "oral_groove"
# Se divide a lo largo, de la boca a la escópula (Lynn 2008); una hija se va como telotroco.
division_axis = "longitudinal"
relative_speed = 0.4
initial_count = 8
cyclosis = 2.0
ph = [6.0, 9.5]
temperature = [5.0, 32.0]
storage = "glycogen"
wall = "none"
genome = { trichocysts = 0.0 }
[being.shape]
# Contraído (casi una esfera); extendido, la campana de [being.contraction] con el mismo volumen.
semi_major_axis = 35.2
semi_minor_axis = 32.0
shape_memory = 10.0
color = [182, 186, 168]
nucleus = 0.32

[being.appearance]
style = "peristomal_crown"

# Zooide contráctil (mionemas): ante un estímulo, el peristoma se cierra sobre la corona y la campana se
# redondea en milisegundos; se vuelve a abrir en segundos. Extendido mide 80 µm de largo, en
# campana desde la escópula (unida al tallo) hasta el peristoma; el ancho del peristoma sale de conservar
# el volumen. El telotroco nada contraído, con el peristoma cerrado, como un cilindro corto y con el
# polo aboral adelante (lo empuja la corona de cilios posterior). Tiempo de re-extensión y ancho de la
# escópula: estimados.
[being.contraction]
extension = 1.14
extension_s = 3.0
profile = "bell"
foot_width = 0.12
swimming_extension = 0.0
swimming_squareness = 3.5
aboral_first = true

# Tallo: vaina elástica de unos µm de ancho con el espasmonema en hélice, descentrado. Se enrolla a ~1/3
# de su largo en ~5 ms (Ca²⁺, sin ATP: Amos 1971; Moriyama, Hiyama & Asai 1998, Biophys. J. 74: 487;
# Upadhyaya et al. 2008, PNAS 105: 18466), se re-extiende en ~1–2 s y también se contrae sola cada tanto.
# Con hambre el zooide arma el telotroco y deja el tallo. Ancho, flexión, crecimiento y frecuencia de las
# contracciones espontáneas: estimados.
[being.stalk]
kind = "spasmoneme"
length = 150.0
width = 3.0
bending_rate = 3.0
growth_hours = 4.0
contracted_fraction = 0.35
extension_s = 2.0
spontaneous_per_min = 0.5
detaches = true

# Mecanorrecepción: una corriente brusca (más de ~2/s de deformación) dispara la contracción.
[[being.response]]
field = "shear"
kind = "above"
threshold = 2.0
action = "contract"
refractory = 2.0

# Vacuola contráctil: se llena con el agua que entra por ósmosis y se vacía de golpe. Período en agua
# dulce estimado; osmolaridad del citosol del orden de la de Paramecium (~60 mOsm; Stock et al. 2002), a
# verificar para la especie.
[being.contractile_vacuole]
period_s = 10.0
cytosol_mosm = 60.0
