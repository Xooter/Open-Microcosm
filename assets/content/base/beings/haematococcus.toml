# Haematococcus lacustris (H. pluvialis): volvocal de 10–50 µm (la célula) dentro de una envoltura
# esférica grande, con dos flagelos que la atraviesan, estigma y gránulos rojos de astaxantina; vive en
# charcos de piedra y bebederos (Kreutz). Con estrés se enquista y se vuelve roja (aplanosporas).
# Pigmento de estrés: con luz alta o sin nitrógeno acumula astaxantina en gotas de lípidos, sobre todo en
# el quiste, en unos días; la astaxantina filtra la luz y la protege del daño fotooxidativo (Boussiba
# 2000, Physiol. Plant. 108: 111). Tasas y umbrales estimados por ese curso temporal (días); la célula
# verde, sin pigmento, sufre con la luz intensa (fotoinhibición).
[[being]]
id = "haematococcus"
name = "Haematococcus"
tags = ["alga", "green_alga", "flagellate", "phototroph"]
description = "Alga verde de ~35 um con dos flagelos dentro de una envoltura de gelatina. Cuando el charco se seca se enquista y se vuelve rojo sangre (astaxantina)."
locomotion = "flagellum"
body_plan = "flagellate_chlorophyte"
phototaxis = true
encysts = true
initial_count = 4
chloroplasts = true
ph = [5.5, 9.5]
temperature = [2.0, 32.0]
storage = "starch"
wall = "cellulose"
[being.shape]
semi_major_axis = 17.0
semi_minor_axis = 16.0
shape_memory = 12.0
color = [150, 168, 96]
nucleus = 0.3

[being.appearance]
style = "two_flagella"
plastid_color = [110, 150, 60]

[being.light_damage]
threshold = 0.7
stress = 0.5

[being.stress_pigment]
rate_per_hour = 0.02
decay_per_hour = 0.005
light_threshold = 0.6
protection = 0.8
color = [175, 35, 25]
