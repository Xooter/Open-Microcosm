# Cosmarium botrytis: desmidia de dos semicélulas de 56–111 × 48–85 µm con verrugas, unidas por un
# istmo, con dos pirenoides por semicélula (Kreutz).
[[being]]
id = "cosmarium"
name = "Cosmarium"
tags = ["alga", "green_alga", "desmid", "phototroph", "chytrid_host"]
description = "Desmidia de ~85 um hecha de dos mitades simetricas unidas por un istmo. Al dividirse, cada hija se queda con una mitad y fabrica la otra."
locomotion = "cilia"
body_plan = "green_alga"
relative_speed = 0.0
relative_photosynthesis = 1.3
initial_count = 3
chloroplasts = true
ph = [5.0, 9.0]
temperature = [2.0, 30.0]
storage = "starch"
wall = "cellulose"
genome = { chloroplasts = 1.0, trichocysts = 0.0 }
[being.shape]
semi_major_axis = 42.0
semi_minor_axis = 33.0
shape_memory = 30.0
color = [138, 182, 112]
nucleus = 0.15

# Seno: la escotadura profunda y angosta que separa las dos semicélulas, de cada lado del istmo (de
# ~1/3 del ancho; Kreutz). Profundidad y abertura estimadas.
[[being.process]]
kind = "notch"
at = 90.0
length = 23.0
base_width = 4.0
tip_width = 3.0
count = 2
fillet = 2.0

# Al dividirse, cada hija conserva una semicélula y la otra brota del istmo y se expande en unas horas
# (Meindl 1993, Microbiol. Rev. 57: 415; tiempo estimado, a verificar).
[being.semicell]
regrowth_hours = 3.0

[being.appearance]
style = "coccoid"
