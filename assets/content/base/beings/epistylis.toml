# Epistylis plicatilis: peritrico de zooides de 90–120 × 25–50 µm sobre un tallo NO contráctil y
# ramificado que forma colonias de hasta 4 mm (Kreutz). Acá un zooide sobre su tallo: la colonia no se
# modela. A diferencia de Vorticella, el tallo no tiene espasmonema.
[[being]]
id = "epistylis"
name = "Epistylis"
tags = ["protist", "ciliate", "bacterivore"]
description = "Ciliado en forma de copa (~100 um) sobre un tallo rigido y ramificado; las colonias llegan a varios milimetros. Filtra bacterias con la corona del peristoma."
locomotion = "cilia"
body_plan = "ciliate"
feeding = "oral_groove"
relative_speed = 0.4
conjugation = true
initial_count = 3
sessile = true
stalk_length = 200.0
cyclosis = 2.0
ph = [6.0, 9.5]
temperature = [5.0, 30.0]
storage = "glycogen"
wall = "none"
genome = { trichocysts = 0.0 }
[being.shape]
semi_major_axis = 52.0
semi_minor_axis = 19.0
shape_memory = 10.0
color = [182, 186, 168]
nucleus = 0.3

[being.appearance]
style = "peristomal_crown"

[physiology.epistylis.max_growth]
# Sin medición de la especie: estimación alométrica ln r = 1,52 ln T − 0,27 ln V − 1,44 (r en 1/día, T en
# °C, V en µm³) a 20 °C, con el volumen del esferoide de [being.shape] (semiejes 52, 19 y 19 µm: 78632 µm³).
value = 1.07
unit = "1/day"
temperature = 20.0
source = "Estimación alométrica con la regresión de Müller, H. & Geller, W. (1993). Maximum growth rates of aquatic ciliated protozoa: the dependence on body size and temperature reconsidered. Arch. Hydrobiol. 126: 315-327 (r a 20 °C para un ciliado de 78632 µm³). No es una medición de la especie."
estimate = true
