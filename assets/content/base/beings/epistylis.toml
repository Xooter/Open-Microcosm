# Epistylis plicatilis: peritrico de zooides de 90–120 × 25–50 µm sobre un tallo NO contráctil y
# ramificado que forma colonias de hasta 4 mm (Kreutz). Acá un zooide sobre su tallo: la colonia no se
# modela. A diferencia de Vorticella, el tallo no tiene espasmonema.
[[being]]
id = "epistylis"
name = "Epistylis"
tags = ["protist", "ciliate", "bacterivore"]
description = "Ciliado en forma de copa (~100 um) sobre un tallo rigido y ramificado; las colonias llegan a varios milimetros. Filtra bacterias con la corona del peristoma."
locomotion = "cilia"
body_plan = "ciliate"
feeding = "oral_groove"
relative_speed = 0.4
conjugation = true
initial_count = 3
cyclosis = 2.0
ph = [6.0, 9.5]
temperature = [5.0, 30.0]
storage = "glycogen"
wall = "none"
genome = { trichocysts = 0.0 }
[being.shape]
# Contraído (casi una esfera); extendido, la campana de [being.contraction] con el mismo volumen.
semi_major_axis = 28.3
semi_minor_axis = 25.7
shape_memory = 10.0
color = [182, 186, 168]
nucleus = 0.3

[being.appearance]
style = "peristomal_crown"

# Zooide contráctil (mionemas): ante un estímulo, el peristoma se cierra sobre la corona y la campana se
# redondea en milisegundos; se vuelve a abrir en segundos. Extendido mide 104 µm de largo (Kreutz), en
# campana desde la escópula (unida al tallo) hasta el peristoma; el ancho del peristoma sale de conservar
# el volumen. El telotroco nada contraído, con el peristoma cerrado, como un cilindro corto y con el
# polo aboral adelante (lo empuja la corona de cilios posterior). Tiempo de re-extensión y ancho de la
# escópula: estimados.
[being.contraction]
extension = 1.84
extension_s = 5.0
profile = "bell"
foot_width = 0.2
swimming_extension = 0.0
swimming_squareness = 3.5
aboral_first = true

# Tallo rígido y grueso, sin espasmonema, con estrías longitudinales (Kreutz); se contrae el zooide, no el
# tallo. Colonial: las hijas quedan en ramas dicotómicas (hasta 12 zooides acá). Ancho estimado.
[being.stalk]
kind = "rigid"
length = 200.0
width = 8.0
bending_rate = 30.0
growth_hours = 6.0
detaches = true
colony = true
max_zooids = 12
branch_angle = 30.0

# Mecanorrecepción: una corriente brusca contrae el zooide (el tallo rígido no se contrae). Umbral
# estimado, como en Vorticella.
[[being.response]]
field = "shear"
kind = "above"
threshold = 2.0
action = "contract"
refractory = 2.0

[physiology.epistylis.max_growth]
# Sin medición de la especie: estimación alométrica ln r = 1,52 ln T − 0,27 ln V − 1,44 (r en 1/día, T en
# °C, V en µm³) a 20 °C, con el volumen del esferoide de [being.shape] (semiejes 28.3, 25.7 y 25.7 µm, la forma contraída: 78632 µm³).
value = 1.07
unit = "1/day"
temperature = 20.0
source = "Estimación alométrica con la regresión de Müller, H. & Geller, W. (1993). Maximum growth rates of aquatic ciliated protozoa: the dependence on body size and temperature reconsidered. Arch. Hydrobiol. 126: 315-327 (r a 20 °C para un ciliado de 78632 µm³). No es una medición de la especie."
estimate = true
