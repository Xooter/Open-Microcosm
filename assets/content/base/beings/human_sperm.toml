# Espermatozoide humano: el gameto masculino. Cabeza oval aplanada de ~4,2 × 2,8 µm (OMS 2021: largo
# 3,7–4,7 µm, ancho 2,5–3,2 µm) con el acrosoma encima del núcleo, y una cola de ~50 µm (pieza
# intermedia de ~4–5 µm con las mitocondrias, pieza principal de ~45 µm). Nada empujado por la cola
# (flagelo posterior, "pusher"), con una onda plana que hace oscilar la cabeza a los lados.
#
# Simplificaciones: el cuerpo blando es solo la cabeza; la cola se dibuja y su empuje va al agua a lo
# largo de ella (`flagellum_length`), pero no choca con otras colas. El batido lo mueve la dineína (una
# ATPasa): con calor la rapidez y la frecuencia suben, con el Q10 medido de cada una (no el general de la
# biología, que daría el triple de lo medido). No come: vive de la fructosa del plasma seminal (fructólisis, Mann 1964), no se
# divide y al morir queda entero e inmóvil (no se parte en cuerpos apoptóticos).
[[being]]
id = "human_sperm"
name = "Espermatozoide humano"
tags = ["human_cell", "animal_cell", "gamete"]
description = "Gameto masculino: una cabeza oval de ~4 um con el nucleo haploide y el acrosoma, y una cola de ~50 um que lo empuja desde atras. No come ni se divide: vive de la fructosa del semen. Al morir deja de nadar y queda entero e inmovil."
body_plan = "spermatozoon"
locomotion = "flagellum"
flagellum = "posterior"
flagellum_length = 50.0
feeding = "none"
# La rapidez y el batido van en [physiology.human_sperm.swim_speed] y [...beat_frequency], medidos a dos
# temperaturas. Desplazamiento lateral de la cabeza: ALH 2,15 µm a 37 °C (de pico a pico; acá ±1,08 µm;
# García-Molina et al. 2023, Rev. Int. Androl. 21(2)).
helix_radius = 1.08
# La cabeza es casi toda cromatina compactada por protaminas (mucha más materia seca por volumen que
# una célula común) y la masa de la cola (~10 µm³: axonema, fibras densas, mitocondrias) no está en el
# cuerpo blando. Estimación: ~10 pg de materia seca en total (ADN haploide 3,3 pg + protaminas y la
# cola), unas 3 veces el esferoide de la cabeza.
relative_dry_mass = 3.2
ph = [6.5, 8.5]
temperature = [15.0, 40.0]
max_salinity = 16.0
storage = "none"
wall = "none"
[being.shape]
semi_major_axis = 2.1
semi_minor_axis = 1.4
# La cabeza es aplanada como una paleta: ~1,5 µm de espesor (OMS 2021).
thickness = 0.75
shape_memory = 15.0
color = [222, 220, 210]
nucleus = 0.8
cytoplasm_granules = false
[being.cell]
adherent = false
rounded_radius = 1.7
contact_inhibition_locomotion = false
contact_inhibition_proliferation = false
divides = false
death = "immotile"
[being.appearance]
style = "spermatozoon"
# Recorrido pasivo: sin sentidos ni reacción de evitación. En una cámara de ~20 µm los progresivos van en
# arcos amplios (Woolley 2003, Reproduction 126: 259); estimación: radio ~60 µm y una difusión rotacional
# que deja la rectitud (VSL/VAP) en ~0,8, la medida a 37 °C (García-Molina et al. 2023: 43,1/54,5).
[being.swim_path]
curvature_radius = 60.0
rotational_diffusion = 0.3
noise_s = 0.3
# Una muestra normal (la mediana de los hombres de las tablas de referencia de la OMS 2021; Campbell et al.
# 2021, Hum. Reprod. Update): progresivos ~55 % y vitalidad ~78 % (22 % muertos). Los no progresivos
# (~5 %) y, con ellos, los inmóviles vivos son estimación. La rapidez varía entre individuos con un CV de
# ~30 % (distribuciones de VAP de CASA; estimación). En el panel Placa se arma cualquier otra muestra.
[being.motility]
progressive = 0.55
non_progressive = 0.05
immotile = 0.18
dead = 0.22
speed_cv = 0.3
non_progressive_speed = 0.2
non_progressive_radius = 6.0

[physiology.human_sperm.swim_speed]
value = 54.5
unit = "um/s"
temperature = 37.0
q10 = 1.31
source = "VAP con CASA, semen incubado y analizado a 37 °C: 54,5 µm/s; a 23 °C, 37,4 µm/s (García-Molina et al. 2023, Rev. Int. Androl. 21(2), tabla 2). El Q10 sale de las dos: (54,5/37,4)^(10/14) = 1,31; incluye el cambio de viscosidad del plasma seminal."

[physiology.human_sperm.beat_frequency]
value = 15.3
unit = "Hz"
temperature = 37.0
q10 = 1.15
source = "BCF con CASA: 15,3 Hz a 37 °C y 12,6 Hz a 23 °C (García-Molina et al. 2023, Rev. Int. Androl. 21(2), tabla 2): Q10 = (15,3/12,6)^(10/14) = 1,15."

[physiology.human_sperm.motility_half_life]
value = 12.0
unit = "h"
temperature = 37.0
source = "In vitro a 37 °C la motilidad de una muestra cae a la mitad en horas (la OMS pide evaluarla antes de 1 h de la eyaculación). Estimación: ~12 h."
estimate = true

[physiology.human_sperm.lifespan]
value = 30.0
unit = "h"
temperature = 37.0
source = "La membrana resiste más que la motilidad (la vitalidad de una muestra supera a su motilidad; OMS 2021); en el moco cervical sobreviven varios días. Vida media de la vitalidad estimada en ~30 h a 37 °C."
estimate = true

[physiology.human_sperm.glucose_vmax]
value = 11.0
unit = "fmol/h"
temperature = 37.0
source = "Índice de fructólisis de Mann: ~1,5–2 mg de fructosa por 10⁹ espermatozoides por hora a 37 °C, ~8–11 fmol por célula (Mann 1964, The Biochemistry of Semen and of the Male Reproductive Tract). La fructosa entra a la glucólisis como la glucosa."
estimate = true

[physiology.human_sperm.glucose_km]
value = 6.0
unit = "mM"
temperature = 37.0
source = "Km de GLUT5 por la fructosa: ~6–11 mM (Burant et al. 1992, J. Biol. Chem. 267:14523); el espermatozoide humano expresa GLUT5 y GLUT3."
estimate = true

[physiology.human_sperm.lactate_per_glucose]
value = 1.8
unit = "mol/mol"
temperature = 37.0
source = "La fructólisis del espermatozoide termina en ácido láctico, que se acumula en el semen (Mann 1964)."
estimate = true
