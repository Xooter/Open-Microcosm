# Espermatozoide humano: el gameto masculino. Cabeza oval aplanada de ~4,2 × 2,8 µm (OMS 2021: largo
# 3,7–4,7 µm, ancho 2,5–3,2 µm) con el acrosoma encima del núcleo, y una cola de ~50 µm (pieza
# intermedia de ~4–5 µm con las mitocondrias, pieza principal de ~45 µm). Nada empujado por la cola
# (flagelo posterior, "pusher"), con una onda plana que hace oscilar la cabeza a los lados.
#
# Simplificaciones: el cuerpo blando es solo la cabeza; la cola se dibuja y su empuje va al agua a lo
# largo de ella (`flagellum_length`), pero no choca con otras colas. El batido lo mueve la dineína (una
# ATPasa): con calor la rapidez y la frecuencia suben, con el Q10 medido de cada una (no el general de la
# biología, que daría el triple de lo medido). No come: vive de la fructosa del plasma seminal (fructólisis, Mann 1964), no se
# divide y al morir queda entero e inmóvil (no se parte en cuerpos apoptóticos).
[[being]]
id = "human_sperm"
name = "Espermatozoide humano"
tags = ["human_cell", "animal_cell", "gamete"]
description = "Gameto masculino: una cabeza oval de ~4 um con el nucleo haploide y el acrosoma, y una cola de ~50 um que lo empuja desde atras. No come ni se divide: vive de la fructosa del semen. Al morir deja de nadar y queda entero e inmovil."
body_plan = "spermatozoon"
locomotion = "flagellum"
flagellum = "posterior"
flagellum_length = 50.0
feeding = "none"
# La rapidez, el batido y el desplazamiento lateral de la cabeza van en [physiology.human_sperm.swim_speed],
# [...beat_frequency] y [...lateral_amplitude], medidos a dos temperaturas.
# La cabeza es casi toda cromatina compactada por protaminas (mucha más materia seca por volumen que
# una célula común) y la masa de la cola (~10 µm³: axonema, fibras densas, mitocondrias) no está en el
# cuerpo blando. Estimación: ~10 pg de materia seca en total (ADN haploide 3,3 pg + protaminas y la
# cola), unas 3 veces el esferoide de la cabeza.
relative_dry_mass = 3.2
ph = [6.5, 8.5]
temperature = [15.0, 40.0]
max_salinity = 16.0
storage = "none"
wall = "none"
[being.shape]
semi_major_axis = 2.1
semi_minor_axis = 1.4
# Oval, apenas más angosta en la región post-acrosómica (OMS 2021: cabeza lisa, de contorno regular).
taper = 0.12
# La cabeza es aplanada como una paleta: ~1,5 µm de espesor (OMS 2021).
thickness = 0.75
shape_memory = 15.0
color = [222, 220, 210]
nucleus = 0.8
cytoplasm_granules = false
[being.cell]
adherent = false
rounded_radius = 1.7
contact_inhibition_locomotion = false
contact_inhibition_proliferation = false
divides = false
death = "immotile"
# Prueba hiposmótica (HOS; Jeyendran et al. 1984, J. Reprod. Fertil. 70: 219): en la solución de 150 mOsm la
# cola de los vivos se hincha y se enrolla en minutos (la OMS la lee a los 5–30 min a 37 °C). Isotónico
# ~290 mOsm; fracción osmóticamente inactiva y tiempo, estimación.
[being.osmotic_swelling]
isotonic = 290.0
inactive = 0.4
full_osmolarity = 150.0
seconds = 60.0
# Capacitación e hiperactivación (Visconti et al. 2011, Asian J. Androl. 13: 395): en un medio con
# bicarbonato (~25 mM) y albúmina a 37 °C. Lo hiperactivado se reconoce por VCL ≥ 150 µm/s, LIN ≤ 50 % y
# ALH ≥ 7 µm (los umbrales de CASA de Biol. Reprod. 2017, doi 10.1093/biolre/iox120); la fracción
# hiperactivada (~15 %) y su forma de nadar son estimación. Reacción acrosómica: en capacitados, ~10 %
# espontánea y ~22 % con progesterona (Zygote: de 10,5 % a 21,8 %); la tasa y la EC50 son estimación. La
# quimiotaxis a la progesterona empieza a ~10 pM (~3·10⁻⁶ µg/mL; Teves et al. 2006, Fertil. Steril. 86: 745).
[being.capacitation]
min_bicarbonate = 15000.0
min_albumin = 0.05
min_temperature = 30.0
hyperactivated_fraction = 0.15
hyper_lateral_amplitude = 8.0
hyper_beat_scale = 0.7
hyper_curvature_radius = 12.0
hyper_rotational_diffusion = 2.0
spontaneous_reaction_per_hour = 0.03
inducer = "progesterone"
induced_reaction_per_hour = 0.5
inducer_ec50 = 0.03
chemotaxis_threshold = 3e-6
# Morfología con los criterios estrictos (Tygerberg; OMS 2021: límite inferior de referencia 4 % de formas
# normales). Una muestra típica con ~14 % de normales (la mediana de los hombres fértiles de la OMS 2010 es
# ~15 %); el reparto de los defectos (cabeza amorfa la más común), su forma y lo que les cuesta nadar son
# estimación. El panel Placa cambia la fracción de normales.
[[being.morphotype]]
id = "normal"
name = "normal"
fraction = 0.14
normal = true
[[being.morphotype]]
id = "amorphous"
name = "cabeza amorfa"
fraction = 0.3
length = 0.95
width = 1.2
taper = 0.3
speed = 0.9
[[being.morphotype]]
id = "tapered"
name = "cabeza afinada"
fraction = 0.12
length = 1.15
width = 0.7
[[being.morphotype]]
id = "pyriform"
name = "cabeza piriforme"
fraction = 0.1
taper = 0.45
[[being.morphotype]]
id = "round"
name = "cabeza redonda (sin acrosoma)"
fraction = 0.04
length = 0.75
width = 1.1
acrosome = false
speed = 0.8
[[being.morphotype]]
id = "small"
name = "cabeza chica"
fraction = 0.06
length = 0.75
width = 0.75
[[being.morphotype]]
id = "large"
name = "cabeza grande"
fraction = 0.04
length = 1.25
width = 1.25
speed = 0.9
[[being.morphotype]]
id = "bent_neck"
name = "cuello doblado"
fraction = 0.08
neck_bend = 60.0
speed = 0.7
[[being.morphotype]]
id = "coiled_tail"
name = "cola enrollada"
fraction = 0.07
coiled_tail = true
speed = 0.2
[[being.morphotype]]
id = "droplet"
name = "gota citoplasmatica"
fraction = 0.05
droplet = true
speed = 0.9
[being.appearance]
style = "spermatozoon"
# La cabeza gira sobre su eje largo al nadar: ~6 Hz (6,0 ± 2,1 Hz en espermatozoides humanos sujetos con una
# pinza óptica; Schiffer et al. 2020, citado en Front. Bioeng. Biotechnol. 2022, 10: 1028857).
roll_hz = 6.0
# Recorrido pasivo: sin sentidos ni reacción de evitación. En una cámara de ~20 µm los progresivos van en
# arcos amplios (Woolley 2003, Reproduction 126: 259); estimación: radio ~60 µm y una difusión rotacional
# que deja la rectitud (VSL/VAP) en ~0,8, la medida a 37 °C (García-Molina et al. 2023: 43,1/54,5).
[being.swim_path]
curvature_radius = 60.0
rotational_diffusion = 0.3
noise_s = 0.3
# Reotaxis positiva (Kantsler et al. 2014, eLife 3: e02403): en su modelo α = 0,2–0,4, β = 0,05–0,1 con
# χ = +1 para el humano a baja viscosidad, y ruido angular 0,2–0,3 rad/s (el de arriba).
rheotaxis_alignment = 0.3
rheotaxis_chirality = 0.075
# Una muestra normal (la mediana de los hombres de las tablas de referencia de la OMS 2021; Campbell et al.
# 2021, Hum. Reprod. Update): progresivos ~55 % y vitalidad ~78 % (22 % muertos). Los no progresivos
# (~5 %) y, con ellos, los inmóviles vivos son estimación. La rapidez varía entre individuos con un CV de
# ~30 % (distribuciones de VAP de CASA; estimación). En el panel Placa se arma cualquier otra muestra.
[being.motility]
progressive = 0.55
non_progressive = 0.05
immotile = 0.18
dead = 0.22
speed_cv = 0.3
non_progressive_speed = 0.08
non_progressive_radius = 6.0

[physiology.human_sperm.swim_speed]
value = 54.5
unit = "um/s"
temperature = 37.0
q10 = 1.31
source = "VAP con CASA, semen incubado y analizado a 37 °C: 54,5 µm/s; a 23 °C, 37,4 µm/s (García-Molina et al. 2023, Rev. Int. Androl. 21(2), tabla 2). El Q10 sale de las dos: (54,5/37,4)^(10/14) = 1,31; incluye el cambio de viscosidad del plasma seminal."

[physiology.human_sperm.beat_frequency]
value = 15.3
unit = "Hz"
temperature = 37.0
q10 = 1.15
source = "BCF con CASA: 15,3 Hz a 37 °C y 12,6 Hz a 23 °C (García-Molina et al. 2023, Rev. Int. Androl. 21(2), tabla 2): Q10 = (15,3/12,6)^(10/14) = 1,15."

[physiology.human_sperm.motility_half_life]
value = 12.0
unit = "h"
temperature = 37.0
source = "In vitro a 37 °C la motilidad de una muestra cae a la mitad en horas (la OMS pide evaluarla antes de 1 h de la eyaculación). Estimación: ~12 h."
estimate = true

[physiology.human_sperm.lateral_amplitude]
value = 2.15
unit = "um"
temperature = 37.0
q10 = 1.20
source = "ALH con CASA: 2,15 µm a 37 °C y 1,67 µm a 23 °C (García-Molina et al. 2023, Rev. Int. Androl. 21(2), tabla 2): Q10 = (2,15/1,67)^(10/14) = 1,20."

[physiology.human_sperm.capacitation_time]
value = 4.0
unit = "h"
temperature = 37.0
source = "La capacitación humana in vitro tarda ~3–10 h en un medio con bicarbonato y albúmina a 37 °C (la fosforilación de tirosinas se completa en ~3 h y se revierte fuera del medio; Bedu-Addo et al. 2005, Mol. Hum. Reprod.). Estimación: 4 h."
estimate = true

[physiology.human_sperm.lifespan]
value = 30.0
unit = "h"
temperature = 37.0
source = "La membrana resiste más que la motilidad (la vitalidad de una muestra supera a su motilidad; OMS 2021); en el moco cervical sobreviven varios días. Vida media de la vitalidad estimada en ~30 h a 37 °C."
estimate = true

[physiology.human_sperm.glucose_vmax]
value = 11.0
unit = "fmol/h"
temperature = 37.0
source = "Índice de fructólisis de Mann: ~1,5–2 mg de fructosa por 10⁹ espermatozoides por hora a 37 °C, ~8–11 fmol por célula (Mann 1964, The Biochemistry of Semen and of the Male Reproductive Tract). La fructosa entra a la glucólisis como la glucosa."
estimate = true

[physiology.human_sperm.glucose_km]
value = 6.0
unit = "mM"
temperature = 37.0
source = "Km de GLUT5 por la fructosa: ~6–11 mM (Burant et al. 1992, J. Biol. Chem. 267:14523); el espermatozoide humano expresa GLUT5 y GLUT3."
estimate = true

[physiology.human_sperm.lactate_per_glucose]
value = 1.8
unit = "mol/mol"
temperature = 37.0
source = "La fructólisis del espermatozoide termina en ácido láctico, que se acumula en el semen (Mann 1964)."
estimate = true
