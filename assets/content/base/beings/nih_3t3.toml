# NIH/3T3: fibroblastos de embrión de ratón (Todaro y Green, 1962-63), la línea de la inhibición por
# contacto. Fusiforme, ~70 × 20 µm extendida; volumen estimado ~1800 µm³ (sin dato medido: la masa seca
# relativa sale de ahí). Valores medidos con fuente en [physiology].
[[being]]
id = "nih_3t3"
name = "Fibroblasto NIH/3T3 (raton)"
tags = ["animal_cell", "fibroblast"]
description = "Linea de fibroblastos de embrion de raton (3T3, 1962). Fusiformes y pegados al fondo, se frenan al tocarse y dejan de dividirse al llenar la placa: el ejemplo clasico de inhibicion por contacto."
body_plan = "adherent_human_cell"
locomotion = "crawl"
feeding = "none"
relative_dry_mass = 0.12
ph = [6.8, 7.8]
temperature = [30.0, 40.0]
max_salinity = 16.0
storage = "glycogen"
wall = "none"
[being.shape]
semi_major_axis = 35.0
semi_minor_axis = 10.0
shape_memory = 2.0
color = [214, 210, 198]
nucleus = 0.45
squareness = 1.4
[being.cell]
adherent = true
rounded_radius = 8.0
contact_inhibition_locomotion = true
contact_inhibition_proliferation = true
min_serum = 0.01
[being.appearance]
style = "adherent_cell"

[physiology.nih_3t3.max_growth]
value = 19.0
unit = "h"
temperature = 37.0
source = "JCRB Cell Bank, JCRB0615 (NIH/3T3 clon 5611): tiempo de duplicación ~19 h. Otras fuentes dan 20-24 h."
estimate = true

[physiology.nih_3t3.phase_g1]
value = 6.0
unit = "h"
temperature = 37.0
source = "Completa la duplicación de ~19 h con S, G2 y M de la célula de mamífero típica (Alberts et al., MBoC 6ª ed., fig. 17-4: S 8 h, G2 4 h, M 1 h)."
estimate = true

[physiology.nih_3t3.phase_s]
value = 8.0
unit = "h"
temperature = 37.0
source = "Alberts et al., Molecular Biology of the Cell, 6ª ed., fig. 17-4 (célula de mamífero típica en cultivo)."
estimate = true

[physiology.nih_3t3.phase_g2]
value = 4.0
unit = "h"
temperature = 37.0
source = "Alberts et al., Molecular Biology of the Cell, 6ª ed., fig. 17-4."
estimate = true

[physiology.nih_3t3.phase_m]
value = 1.0
unit = "h"
temperature = 37.0
source = "Alberts et al., Molecular Biology of the Cell, 6ª ed., fig. 17-4."
estimate = true

[physiology.nih_3t3.migration_speed]
value = 18.0
unit = "um/h"
temperature = 37.0
source = "Células 3T3 sobre sustrato 2D: ~80 % con rapidez de 0,1-0,5 µm/min (arXiv:0806.4518, motilidad de células normales y cancerosas según la rigidez del sustrato); valor central 0,3 µm/min."
estimate = true

[physiology.nih_3t3.persistence]
value = 2.5
unit = "h"
temperature = 37.0
source = "Gail, M. H. & Boone, C. W. (1970). The locomotion of mouse fibroblasts in tissue culture. Biophys. J. 10: 980-993: la dirección persiste de un intervalo de 2,5 h al siguiente y es aleatoria a las 5 h."
estimate = true

[physiology.nih_3t3.confluence]
value = 40000.0
unit = "1/cm2"
source = "Sin dato medido de la línea: el de los fibroblastos humanos (~3-5·10⁴ células/cm²). Todaro & Green (1963) describen la detención por contacto de 3T3 en monocapa."
estimate = true

[physiology.nih_3t3.glucose_vmax]
value = 60.0
unit = "fmol/h"
temperature = 37.0
source = "Sin dato de la línea: el de los fibroblastos en cultivo (~1-2 µmol por 10⁶ células por día)."
estimate = true

[physiology.nih_3t3.glucose_km]
value = 3.0
unit = "mM"
temperature = 37.0
source = "Km de GLUT1: ~1-3 mM (Carruthers 1990, Physiol. Rev. 70:1135)."

[physiology.nih_3t3.glutamine_vmax]
value = 12.0
unit = "fmol/h"
temperature = 37.0
source = "Sin dato de la línea: ~20 % del consumo de glucosa, como en células no tumorales."
estimate = true

[physiology.nih_3t3.glutamine_km]
value = 0.1
unit = "mM"
temperature = 37.0
source = "Km de los transportadores de glutamina (ASCT2/SLC1A5) del orden de 0,1 mM."
estimate = true

[physiology.nih_3t3.lactate_per_glucose]
value = 1.0
unit = "mol/mol"
temperature = 37.0
source = "Sin dato de la línea: ~1 lactato por glucosa en células no tumorales en cultivo."
estimate = true
