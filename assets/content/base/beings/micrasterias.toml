# Micrasterias rotata: desmidia en disco de 200–400 × 190–270 µm, con dos semicélulas de cinco lóbulos
# muy recortados; de turberas y pantanos (Kreutz).
[[being]]
id = "micrasterias"
name = "Micrasterias"
tags = ["alga", "green_alga", "desmid", "phototroph"]
description = "Desmidia grande (~0,3 mm) en forma de estrella plana con lobulos recortados, de los pantanos acidos. Una de las celulas mas bellas del microscopio."
locomotion = "cilia"
body_plan = "green_alga"
relative_speed = 0.0
relative_photosynthesis = 1.2
initial_count = 1
chloroplasts = true
ph = [4.0, 8.0]
temperature = [2.0, 28.0]
storage = "starch"
wall = "cellulose"
genome = { chloroplasts = 1.0, trichocysts = 0.0 }
[being.shape]
semi_major_axis = 150.0
semi_minor_axis = 115.0
thickness = 30.0
shape_memory = 30.0
color = [136, 180, 110]
nucleus = 0.1

# Semicélulas de cinco lóbulos (Kreutz): el seno profundo y angosto del istmo y, en cada semicélula, las
# incisiones entre el lóbulo polar y los laterales (±35° del polo) y las que parten cada lateral en dos
# (±64°), en cuña. Profundidades y aberturas estimadas sobre las figuras; las incisiones, menos
# profundas y algo más anchas que las reales: con paredes a menos de unos 3 puntos de membrana, el surco de la división las cruzaba. Sin el
# margen dentado de los lóbulos (detalle más fino que la membrana).
[[being.process]]
kind = "notch"
at = 90.0
length = 95.0
base_width = 16.0
tip_width = 14.0
count = 2
fillet = 2.0

[[being.process]]
kind = "notch"
at = 0.0
length = 28.0
base_width = 18.0
tip_width = 10.0
count = 2
spread = 140.0
fillet = 2.0

[[being.process]]
kind = "notch"
at = 180.0
length = 28.0
base_width = 18.0
tip_width = 10.0
count = 2
spread = 140.0
fillet = 2.0

[[being.process]]
kind = "notch"
at = 0.0
length = 18.0
base_width = 15.0
tip_width = 10.0
count = 2
spread = 256.0
fillet = 2.0

[[being.process]]
kind = "notch"
at = 180.0
length = 18.0
base_width = 15.0
tip_width = 10.0
count = 2
spread = 256.0
fillet = 2.0

# Al dividirse, cada hija conserva una semicélula y la otra brota del istmo y se expande en unas horas
# (Meindl 1993, Microbiol. Rev. 57: 415; tiempo estimado, a verificar).
[being.semicell]
regrowth_hours = 5.0

[being.appearance]
style = "coccoid"
