# Euglypha strigosa: tecameba de testa ovoide de 45–100 µm, hecha de escamas ovales de sílice con
# espinas, en el musgo y en las turberas (Kreutz). No se estrangula como una ameba desnuda: el
# citoplasma de la hija sale por la abertura, arma su testa con las escamas que la madre tiene en
# reserva y se separa. Acá es la gemación (una yema que crece en un polo y se suelta).
[[being]]
id = "euglypha"
name = "Euglypha"
tags = ["protist", "amoeboid", "testate_amoeba"]
description = "Ameba con una testa ovalada (~70 um) de escamas de silice con espinas. Asoma seudopodos finos por la abertura. Vive en el musgo."
locomotion = "pseudopod"
testate = "filose"
body_plan = "amoeba"
feeding = "phagocytosis"
relative_speed = 0.4
prey = ["chlorella", "navicula", "chlamydomonas", "desmodesmus"]
initial_count = 3
daughter_colonies = 1
budding = true
handling_hours = 1.0
ph = [4.5, 8.5]
temperature = [0.0, 28.0]
storage = "glycogen"
wall = "none"
genome = { armor = 0.9 }
[being.shape]
semi_major_axis = 36.0
semi_minor_axis = 24.0
# La testa de placas de sílice es rígida.
shape_memory = 30.0
color = [200, 198, 186]
nucleus = 0.25

# Espinas cortas pegadas a la testa con un cemento orgánico, sobre todo en los bordes del caparazón
# aplanado y no junto a la abertura (Kreutz). Largo y cantidad estimados por las figuras.
[[being.process]]
kind = "spine"
at = 180.0
length = 6.0
base_width = 1.0
tip_width = 0.3
count = 14
spread = 260.0

