# Closterium moniliferum: desmidia en media luna de 200–350 × 35–55 µm, con dos cloroplastos de
# crestas longitudinales y una vacuola de cristales (yeso) en cada punta; se desplaza despacio
# secretando mucílago por los poros de las puntas (Kreutz).
[[being]]
id = "closterium"
name = "Closterium"
tags = ["alga", "green_alga", "desmid", "phototroph", "chytrid_host"]
description = "Desmidia verde en media luna de ~0,3 mm con dos cloroplastos y una vacuola con cristales que bailan en cada punta. Avanza muy despacio soltando mucilago."
locomotion = "cilia"
body_plan = "green_alga"
relative_speed = 0.003
relative_photosynthesis = 1.3
initial_count = 2
chloroplasts = true
raphe_glider = true
ph = [5.0, 9.0]
temperature = [2.0, 30.0]
storage = "starch"
wall = "cellulose"
genome = { chloroplasts = 1.0, trichocysts = 0.0 }
[being.shape]
semi_major_axis = 137.0
semi_minor_axis = 22.0
shape_memory = 30.0
color = [140, 184, 116]
nucleus = 0.15
# Media luna: el eje se curva en un arco (~100°, estimado sobre Kreutz) y las puntas se afinan.
bend = 100.0
taper = 0.6
taper_front = 0.6

# Volteretas: fija una punta con mucílago, se para sobre ella y cae del otro lado, alternando las
# puntas; entre volteretas se desliza (Yeh & Gibor 1970, Planta 93: 316). Intervalo y duración
# estimados, a verificar en esa fuente.
[being.somersault]
interval_s = 90.0
duration_s = 40.0

[being.appearance]
style = "coccoid"
