# Trachelomonas hispida: euglenoide dentro de una lórica elipsoidal de 20–42 × 15–26 µm cubierta de
# espinas cortas, parda o anaranjada por el hierro y el manganeso; 8–10 cloroplastos y un estigma grande
# (Kreutz). La lórica la secreta la célula y se mineraliza con el hierro (y el manganeso, sin modelar) que
# precipita del agua: recién hecha es hialina y se oscurece en un día o dos (Dunlap, Walne & Bentley 1983,
# Protoplasma 117: 97). Al dividirse, la hija sale por el poro y arma una lórica nueva. Cantidad de hierro
# (~20 veces la cuota celular) y tiempo: estimados.
[[being]]
id = "trachelomonas"
name = "Trachelomonas"
tags = ["protist", "flagellate", "euglenid", "phototroph"]
description = "Euglenoide verde encerrado en una lorica parda de ~30 um, endurecida con hierro y manganeso, por la que asoma un flagelo."
locomotion = "flagellum"
body_plan = "euglenid"
phototaxis = true
initial_count = 6
chloroplasts = true
cyclosis = 1.0
ph = [5.0, 9.5]
temperature = [5.0, 32.0]
storage = "paramylon"
wall = "none"
genome = { armor = 0.8 }
lorica_iron_ratio = 0.002
lorica_hours = 24.0
[being.shape]
semi_major_axis = 15.5
semi_minor_axis = 10.5
shape_memory = 30.0
color = [186, 150, 96]
nucleus = 0.3

# La lórica está cubierta de espinas cortas y agudas, repartidas por toda la superficie (Kreutz): en la
# vista se ven las del contorno. Largo estimado por las figuras. Algunas poblaciones no las tienen.
[[being.process]]
kind = "spine"
at = 0.0
length = 2.0
base_width = 0.8
tip_width = 0.2
count = 36

