# Dinoflagelado tecado (Ceratium): teca de placas de celulosa, un flagelo transversal en el cíngulo y
# uno longitudinal, muchos cloroplastos pardo-amarillos y un núcleo de cromosomas siempre condensados
# (dinocarion).
[[body_plan]]
id = "dinoflagellate"
name = "dinoflagelado"
morphology = "eukaryote"
structures = [
    { kind = "cell_wall", source = "declared", arrangement = "envelope", width = 0.5, count = 1, brightfield = true, name = "teca de placas de celulosa" },
    { kind = "plasma_membrane", source = "simulated", arrangement = "envelope", brightfield = false, name = "membrana plasmatica" },
    { kind = "nucleus", source = "simulated", arrangement = "interior", count = 1, brightfield = true, name = "dinocarion (cromosomas condensados)" },
    { kind = "chloroplast", source = "simulated", arrangement = "interior", brightfield = true, name = "cloroplastos pardo-amarillos" },
    { kind = "mitochondrion", source = "simulated", arrangement = "interior", length = 2.0, width = 0.5, brightfield = false, name = "mitocondrias" },
    { kind = "storage_granule", source = "simulated", arrangement = "interior", brightfield = true, name = "granulos de almidon" },
    { kind = "endoplasmic_reticulum", source = "declared", arrangement = "perinuclear", length = 3.0, width = 0.05, count = 1, brightfield = false, name = "reticulo endoplasmico rugoso" },
    { kind = "golgi", source = "declared", arrangement = "perinuclear", length = 1.0, width = 0.3, count = 1, brightfield = false, name = "aparato de Golgi (un dictiosoma)" },
    { kind = "ribosomes", source = "declared", arrangement = "interior", length = 0.025, width = 0.025, per_um3 = 3000.0, brightfield = false, name = "ribosomas 80S" },
]
