# Coanoflagelado (Salpingoeca): un flagelo rodeado por un collar de ~40 microvellosidades de actina (no hay
# tipo de estructura para el collar: se dibuja como prolongaciones de la cubierta y se nombra en la ficha),
# sin cloroplastos (Dayel & King 2014).
[[body_plan]]
id = "choanoflagellate"
name = "coanoflagelado"
morphology = "eukaryote"
structures = [
    { kind = "plasma_membrane", source = "simulated", arrangement = "envelope", brightfield = true, name = "membrana" },
    { kind = "nucleus", source = "simulated", arrangement = "interior", count = 1, brightfield = true, name = "nucleo" },
    { kind = "mitochondrion", source = "simulated", arrangement = "interior", length = 1.0, width = 0.4, brightfield = false, name = "mitocondrias" },
    { kind = "food_vacuole", source = "simulated", arrangement = "interior", brightfield = true, name = "vacuolas digestivas (bacterias)" },
    { kind = "endoplasmic_reticulum", source = "declared", arrangement = "perinuclear", length = 1.5, width = 0.05, count = 1, brightfield = false, name = "reticulo endoplasmico" },
    { kind = "golgi", source = "declared", arrangement = "perinuclear", length = 0.6, width = 0.2, count = 1, brightfield = false, name = "aparato de Golgi" },
    { kind = "ribosomes", source = "declared", arrangement = "interior", length = 0.025, width = 0.025, per_um3 = 3000.0, brightfield = false, name = "ribosomas 80S" },
]
