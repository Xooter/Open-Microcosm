fotosintesis_relativa = 3.0
divisiones_por_ciclo = 2
cantidad_inicial = 150
cloroplastos = true
ph = [5.0, 9.5]
temperatura = [-2.0, 35.0]
salinidad_max = 60.0
reserva = "almidon"
pared = "celulosa"
[ser.forma]
semieje_mayor = 5.5
semieje_menor = 4.5
memoria_forma = 6.0
color = [110, 170, 80]
nucleo = 0.32

