# 4 hijas (palintomía).

[[ser]]
id = "chlamydomonas"
nombre = "Chlamydomonas"
etiquetas = ["alga", "alga_verde", "flagelado", "fototrofa", "hospeda_quitridios", "fotobionte"]
descripcion = "Alga de dos flagelos que nada como en brazada. Dentro de la pared madre se divide en 4 hijas."
locomocion = "flagelo"
plan = "clorofita_flagelada"
velocidad_relativa = 1.25
huye_de = ["amoeba"]
fototaxis = true
fotosintesis_relativa = 3.0
divisiones_por_ciclo = 2
cantidad_inicial = 150
cloroplastos = true
ph = [5.0, 9.5]
temperatura = [-2.0, 35.0]
salinidad_max = 60.0
reserva = "almidon"
pared = "celulosa"
[ser.forma]
semieje_mayor = 5.5
semieje_menor = 4.5
memoria_forma = 6.0
color = [110, 170, 80]
nucleo = 0.32

[ser.apariencia]
