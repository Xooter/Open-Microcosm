# Seres de la gota del paquete de fábrica (fase 20.0: el contenido como datos).
#
# Cada [[ser]] combina mecanismos que implementa el programa (locomoción, alimentación,
# reproducción, ciclo de vida) y los parametriza. El orden de este archivo es el de las especies
# del programa: no se reordena (las escenas viejas guardan el índice).
#
# Claves (las que faltan toman el valor por omisión del programa):
#   id: estable, sin espacios (lo guardan las escenas); nombre: el que se muestra.
#   etiquetas: grupos (taxonómicos o funcionales) para dietas, huidas y hospedadores.
#     simbionte_obligado: vive solo dentro de su hospedador; en una gota aparece solo si el
#     bioma lo nombra en sus `pesos` (biomas.toml).
#   locomocion: cilios | flagelo | pseudopodo | arrastre (células animales) | ninguna (células de
#   tejidos y frotis); velocidad_relativa respecto de la del tipo.
#   alimentacion: surco_oral | polo_anterior | fagocitosis | raptorial | tentaculos | cuello |
#     osmotrofia | ninguna.
#   presas, presas_boca (lo que traga con la corriente oral), huye_de: ids de seres o etiquetas.
#   conjugacion: se conjuga con otra célula de su especie y de otro tipo de apareamiento.
#   ph y temperatura [°C]: rango tolerado; fuera se paga como mantenimiento extra.
#   reserva: ninguna | almidon | glucogeno | paramilon | crisolaminarina (tinciones).
#   pared: ninguna | celulosa | silice | glucano_levadura.
#   plan: plan corporal (planes.toml): qué estructuras tiene y de qué tamaño.
#   descripcion: qué es y qué hace (ficha y enciclopedia).
#   genoma: genes que difieren de los de su locomoción (tamano, motor, mitocondrias,
#     cloroplastos, lisosomas, tricocistos, coraza, rigidez, apareamiento).
#   [ser.apariencia]: estilo de dibujo con nombre (ciliado, flagelado, ameboide,
#     rostro_de_flagelos, cinturones_y_proboscide, cinta_helicoidal, placa_axial,
#     plastos_estrellados, plasto_reticulado, frustula, colonia_esferica, colonia_plana,
#     corona_peristomal, corona_de_membranelas, tentaculos_capitados, cirros, cuello_extensible,
#     dos_flagelos, levadura, cocoide (célula lisa sin apéndices); por omisión, el de su locomoción)
#     y color_plastos [r, g, b].
#   [ser.forma]: semiejes [µm], memoria_forma [1/s], color RGB del citoplasma, nucleo (radio
#     relativo), cuadratura (2 elipse, ~6 cilindro), afinamiento del polo posterior.
# Paramecium caudatum: ~180 × 50 µm, ciliado bacterívoro.
[[ser]]
id = "paramecium"
nombre = "Paramecium"
etiquetas = ["protista", "ciliado", "bacterivoro"]
descripcion = "Ciliado de ~200 um que come bacterias por un surco oral. Retrocede al chocar (reaccion de evitacion) y se junta donde hay CO2."
locomocion = "cilios"
plan = "ciliado"
alimentacion = "surco_oral"
huye_de = ["didinium", "lacrymaria"]
conjugacion = true
quimiocinesis = true
trampa_acida = true
cantidad_inicial = 20
ciclosis = 4.0
ph = [6.0, 9.5]
temperatura = [5.0, 35.0]
reserva = "glucogeno"
pared = "ninguna"
[ser.forma]
semieje_mayor = 90.0
semieje_menor = 25.0
memoria_forma = 8.0
color = [160, 176, 138]
nucleo = 0.32

