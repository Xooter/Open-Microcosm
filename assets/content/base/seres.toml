# Polarella glacialis: dinoflagelado chico del hielo marino polar, de 10–15 × 4–8 µm; cultivo a 2 °C
# (0–6 °C) (NCMA CCMP1383). Forma quistes en el hielo.
[[ser]]
id = "polarella"
nombre = "Polarella glacialis"
etiquetas = ["protista", "flagelado", "dinoflagelado", "fototrofa", "marina"]
descripcion = "Dinoflagelado diminuto (~12 um) del hielo marino polar. Nada con dos flagelos en los canales de salmuera y forma quistes cuando el hielo se cierra."
locomocion = "flagelo"
plan = "dinoflagelado"
velocidad_relativa = 0.6
fototaxis = true
enquista = true
cantidad_inicial = 10
cloroplastos = true
ph = [7.0, 9.5]
temperatura = [-2.0, 8.0]
salinidad_max = 100.0
reserva = "almidon"
pared = "celulosa"
[ser.forma]
semieje_mayor = 6.2
semieje_menor = 3.5
memoria_forma = 20.0
color = [196, 176, 120]
nucleo = 0.3

[ser.apariencia]
color_plastos = [168, 130, 50]
