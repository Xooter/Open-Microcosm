# Pinnularia viridis: diatomea pennada grande, lineal, de 50–170 × 10–30 µm (Patrick y Reimer 1966),
# con el rafe bien visible; se desliza sobre el vidrio. Frecuente en charcas, turberas y musgos
# húmedos. Sin dato de su velocidad: la de Navicula. La valva real es lineal, de lados paralelos;
# acá es una elipse alargada (cuadratura 2): con la de un cilindro el surco de la división no se
