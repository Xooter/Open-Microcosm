[[medium]]
id = "mueller_hinton"
name = "Caldo Mueller-Hinton"
description = "El medio de referencia para medir la concentracion inhibitoria minima (CIM) de un antibiotico: extracto de carne, hidrolizado de caseina y almidon."
source = "CLSI M07 (dilución en caldo): caldo Mueller-Hinton, 2 g/L de extracto de carne, 17,5 g/L de hidrolizado ácido de caseína y 1,5 g/L de almidón. La materia orgánica como glucosa equivalente (~21 g/L, ~1,2·10^5 µM) es una ESTIMACIÓN."
