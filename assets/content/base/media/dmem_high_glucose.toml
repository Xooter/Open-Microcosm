# La temperatura, el CO₂ y la luz no son del medio sino del ambiente (la incubadora: [plate.environment]).

[[medium]]
id = "dmem_high_glucose"
legacy_ids = ["dmem_alta_glucosa"]
name = "DMEM alta glucosa + 10 % SFB"
description = "Medio de Eagle modificado por Dulbecco con 4,5 g/L de glucosa, L-glutamina y rojo fenol, con 10 % de suero fetal bovino: el medio más usado para fibroblastos, HeLa y muchas otras líneas."
source = "Dulbecco, R. & Freeman, G. (1959). Virology 8:396-397; composición de la formulación comercial (Gibco 11965: DMEM, high glucose, L-glutamine, phenol red). El 3,7 g/L de NaHCO3 está pensado para 10 % de CO2 (pH 7,4)."
[medium.composition]
glucose = 25000.0        # 4,5 g/L
glutamine = 4000.0       # 584 mg/L
alkalinity = 44000.0    # NaHCO3 3,7 g/L
carbonate_pka = 6.1      # 37 °C, fuerza iónica ~0,16 M (el mismo valor que en el plasma)
phosphate = 906.0          # NaH2PO4·H2O 125 mg/L
iron = 0.248           # Fe(NO3)3·9H2O 0,1 mg/L (el suero agrega transferrina, no contada)
# Nitrógeno disponible para bacterias y levaduras: el de los aminoácidos (la glutamina, 8 mM de
# N, y el resto, ~9 mM). Simplificación: la simulación tiene un solo campo de nitrógeno.
nitrogen = 17350.0
silicate = 0.0
vitamin_b12 = 3e-5      # el DMEM no tiene B12: la trae el suero (estimación, ~0,3 nM al 10 %)
salinity = 10.9         # sales disueltas [g/kg]: NaCl 6,4 + NaHCO3 3,7 + KCl, CaCl2, MgSO4, fosfato
serum = 0.10
phenol_red = 15.0        # mg/L
phages = 0.0
organic_inflow = 0.0
detritus_inflow = 0.0
dust = 0.0
