# Placas preparadas del paquete de fábrica (fase 20a). Además de la gota de agua (que sale de un
# bioma), tipos de placa como en un laboratorio: un cultivo celular es un recipiente con medio de
# cultivo, en una incubadora, del que se simula un campo circular: el anillo de vidrio que se ve
# marca el borde del campo simulado (la pared del recipiente real está mucho más lejos).
#
# [[placa]]
#   id, nombre, descripcion
#   tipo: cultivo (el preparado vegetal llega en una fase siguiente)
#   medio: id de medios.toml; recipiente: id de recipientes.toml
#   campo_um: lado del campo simulado [µm] (se lleva a la potencia de 2 de celdas de 8 µm)
#   [placa.ambiente]: temperatura [°C], co2 (fracción del aire), luz (0 en la incubadora)
#   [[placa.siembra]]: ser (id) y densidad_cm2 [células/cm²] al crear la placa

[[placa]]
id = "cultivo_dmem"
nombre = "Cultivo celular (DMEM, incubadora)"
descripcion = "Placa de 35 mm con 2 mL de DMEM alta glucosa y 10 % de suero, en una incubadora a 37 °C y 10 % de CO2 (pH 7,4). Se simula un campo de 2 mm: el anillo de vidrio marca su borde (la pared de la placa real está a 17 mm). Estéril: se le inocula lo que se quiera desde el Catálogo."
tipo = "cultivo"
medio = "dmem_alta_glucosa"
recipiente = "placa_35mm"
campo_um = 2048.0
[placa.ambiente]
temperatura = 37.0
co2 = 0.10
luz = 0.0

# --- Preparados en portaobjetos (fase 20c) ---------------------------------------------------------
# [placa.tejido]: disposicion (hileras, poligonal, filas, rompecabezas), contenido (protoplasto,
# almidon, mitosis, estomas), ser (el protoplasto), largo_um y ancho_um de las células, pared_um,
# osmolaridad_jugo [mOsm/L] del jugo celular con la célula llena, inactivo (fracción osmóticamente
# inactiva) y equilibrio_s (tiempo de equilibrio osmótico, s reales), fases_mitosis [profase,
# metafase, anafase, telofase] (fracción de las células en cada una). fijado: muerto y quieto (frotis,
# corte); tincion: id de la tinción que se aplica al crearlo (lugol, giemsa, orceina_acetica,
# methylene_blue…); celda_um: resolución de la grilla; eritrocitos_cm2 y plaquetas_cm2: sangre;
# bacterias_cm2: bacterias que trae la muestra.

[[placa]]
id = "epidermis_cebolla"
nombre = "Preparado: epidermis de cebolla morada"
descripcion = "La epidermis interna de una escama de cebolla morada montada en agua: celulas alargadas con pared y una vacuola violeta. Agregando sal (Ambiente > Salinidad, unos 30 g/kg) el protoplasto pierde agua y se despega de la pared: plasmolisis. En agua vuelve (deplasmolisis). Se simula un campo de 1 mm: el anillo marca su borde."
tipo = "preparado"
medio = "agua_destilada"
recipiente = "portaobjetos"
campo_um = 1024.0
[placa.ambiente]
temperatura = 22.0
co2 = 0.00042
luz = 1.0
[placa.tejido]
disposicion = "hileras"
contenido = "protoplasto"
ser = "celula_epidermica_cebolla"
largo_um = 250.0
ancho_um = 55.0
pared_um = 2.0
osmolaridad_jugo = 450.0
inactivo = 0.1
equilibrio_s = 120.0

[[placa]]
id = "hoja_elodea"
nombre = "Preparado: hoja de Elodea"
descripcion = "Una hojita de Elodea (Egeria densa) montada en agua: celulas rectangulares llenas de cloroplastos que giran junto a la pared (ciclosis). Con sal se plasmolizan. Se simula un campo de 0,5 mm."
tipo = "preparado"
medio = "agua_destilada"
recipiente = "portaobjetos"
campo_um = 512.0
[placa.ambiente]
temperatura = 22.0
co2 = 0.00042
luz = 1.0
[placa.tejido]
disposicion = "hileras"
contenido = "protoplasto"
ser = "celula_hoja_elodea"
largo_um = 60.0
ancho_um = 20.0
pared_um = 1.0
osmolaridad_jugo = 300.0
inactivo = 0.1
equilibrio_s = 60.0

[[placa]]
id = "papa_lugol"
nombre = "Preparado: papa con Lugol"
descripcion = "Un corte fino de tuberculo de papa tenido con Lugol: celulas grandes del parenquima llenas de amiloplastos, granos de almidon con capas concentricas que el yodo tine de azul negro."
tipo = "preparado"
medio = "agua_destilada"
recipiente = "portaobjetos"
campo_um = 1024.0
fijado = true
tincion = "lugol"
[placa.ambiente]
temperatura = 22.0
co2 = 0.00042
luz = 1.0
[placa.tejido]
disposicion = "poligonal"
contenido = "almidon"
largo_um = 130.0
ancho_um = 130.0
pared_um = 1.5

[[placa]]
id = "raiz_cebolla"
nombre = "Preparado: punta de raiz de cebolla (mitosis)"
descripcion = "Punta de raiz de cebolla fijada, aplastada y tenida con orceina acetica: celulas del meristema en interfase y en cada fase de la mitosis (profase, metafase, anafase y telofase), en la proporcion de lo que dura cada una."
tipo = "preparado"
medio = "agua_destilada"
recipiente = "portaobjetos"
campo_um = 512.0
fijado = true
tincion = "orceina_acetica"
[placa.ambiente]
temperatura = 22.0
co2 = 0.00042
luz = 1.0
[placa.tejido]
disposicion = "filas"
contenido = "mitosis"
largo_um = 18.0
ancho_um = 18.0
pared_um = 0.8
# Allium cepa a ~20 °C: ciclo de ~20 h con la mitosis en ~1,5–2 h; índice mitótico ~8–10 %, la
# profase la fase más larga (~60 % de la mitosis), después telofase, metafase y anafase.
fases_mitosis = [0.05, 0.012, 0.008, 0.02]

[[placa]]
id = "epidermis_hoja"
nombre = "Preparado: epidermis de hoja con estomas"
descripcion = "La epidermis del enves de una hoja: celulas de contorno ondulado (como un rompecabezas) y, entre ellas, los estomas: dos celulas oclusivas en forma de rinon, con cloroplastos, que abren y cierran el ostiolo."
tipo = "preparado"
medio = "agua_destilada"
recipiente = "portaobjetos"
campo_um = 512.0
fijado = true
[placa.ambiente]
temperatura = 22.0
co2 = 0.00042
luz = 1.0
[placa.tejido]
disposicion = "rompecabezas"
contenido = "estomas"
largo_um = 45.0
ancho_um = 45.0
pared_um = 1.0

[[placa]]
id = "mucosa_bucal"
nombre = "Preparado: mucosa bucal con azul de metileno"
descripcion = "Un raspado de la cara interna de la mejilla en solucion salina, tenido con azul de metileno: celulas escamosas planas con un nucleo chico, y bacterias de la boca."
tipo = "preparado"
medio = "solucion_salina_09"
recipiente = "portaobjetos"
campo_um = 1024.0
fijado = true
tincion = "methylene_blue"
# Bacterias de la boca (estreptococos y otras): decenas sobre cada célula escamosa y sueltas.
bacterias_cm2 = 300000.0
[placa.ambiente]
temperatura = 22.0
co2 = 0.00042
luz = 1.0
[[placa.siembra]]
ser = "celula_escamosa_bucal"
densidad_cm2 = 4000.0

[[placa]]
id = "frotis_sangre"
nombre = "Preparado: frotis de sangre con Giemsa"
descripcion = "Una gota de sangre extendida en capa fina, fijada con metanol y tenida con Giemsa: globulos rojos rosados sin nucleo y, cada tanto, globulos blancos (neutrofilos de nucleo lobulado, linfocitos, monocitos) y plaquetas violetas."
tipo = "preparado"
medio = "solucion_salina_09"
recipiente = "portaobjetos"
campo_um = 1024.0
celda_um = 4.0
fijado = true
tincion = "giemsa"
# Frotis fino: ~1,1·10⁶ glóbulos rojos/cm² en una sola capa; leucocitos ~1 cada 700 (sangre normal:
# 4,5–5,5·10⁶ glóbulos rojos y 4–11·10³ leucocitos por µL) en la fórmula normal (neutrófilos
# 55–70 %, linfocitos 20–40 %, monocitos 2–8 %) y plaquetas ~1 cada 15 (150–400·10³/µL).
eritrocitos_cm2 = 1100000.0
plaquetas_cm2 = 70000.0
[placa.ambiente]
temperatura = 22.0
co2 = 0.00042
luz = 1.0
[[placa.siembra]]
ser = "neutrofilo"
densidad_cm2 = 950.0
[[placa.siembra]]
ser = "linfocito"
densidad_cm2 = 500.0
[[placa.siembra]]
ser = "monocito"
densidad_cm2 = 120.0

[[placa]]
id = "sangre_viva"
nombre = "Preparado: sangre diluida en solucion salina"
descripcion = "Sangre diluida en solucion salina 0,9 %, sin fijar: los globulos rojos son discos bicóncavos. Bajando la salinidad (agua) se hinchan y estallan (hemolisis); subiendola se arrugan (crenacion)."
tipo = "preparado"
medio = "solucion_salina_09"
recipiente = "portaobjetos"
campo_um = 512.0
celda_um = 4.0
# Diluida ~1:5 en solución salina: glóbulos rojos separados, que se ven de a uno.
eritrocitos_cm2 = 200000.0
plaquetas_cm2 = 12000.0
[placa.ambiente]
temperatura = 22.0
co2 = 0.00042
luz = 1.0
