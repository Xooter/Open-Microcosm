# Recipientes de cultivo del paquete de fábrica (fase 20a). Un recipiente da el área de cultivo y
# el volumen de medio: la profundidad (volumen / área) fija cuánto medio hay sobre cada célula
# (la química se toma bien mezclada en la vertical) y qué tan rápido entra el O₂ y sale el CO₂
# por la superficie (difusión a través de la capa quieta: D / profundidad²).
#
# [[recipiente]]: id, nombre, area_cm2 (de cultivo), volumen_ml (de trabajo recomendado), fuente.
# Fuente de las áreas y los volúmenes: Corning, "Surface Areas and Recommended Medium Volumes for
# Corning Cell Culture Vessels" (CLS-AN-209).

