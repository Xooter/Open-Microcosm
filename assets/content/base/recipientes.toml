# Recipientes de cultivo del paquete de fábrica (fase 20a). Un recipiente da el área de cultivo y
# el volumen de medio: la profundidad (volumen / área) fija cuánto medio hay sobre cada célula
# (la química se toma bien mezclada en la vertical) y qué tan rápido entra el O₂ y sale el CO₂
# por la superficie (difusión a través de la capa quieta: D / profundidad²).
#
# [[recipiente]]: id, nombre, area_cm2 (de cultivo), volumen_ml (de trabajo recomendado), fuente.
# Fuente de las áreas y los volúmenes: Corning, "Surface Areas and Recommended Medium Volumes for
# Corning Cell Culture Vessels" (CLS-AN-209).

[[recipiente]]
id = "placa_35mm"
nombre = "Placa de 35 mm"
area_cm2 = 8.0
volumen_ml = 2.0

[[recipiente]]
id = "placa_60mm"
nombre = "Placa de 60 mm"
area_cm2 = 21.0
volumen_ml = 5.0

[[recipiente]]
id = "placa_100mm"
nombre = "Placa de 100 mm"
area_cm2 = 55.0
volumen_ml = 10.0

[[recipiente]]
id = "pocillo_6"
nombre = "Pocillo de placa de 6"
area_cm2 = 9.5
volumen_ml = 2.0

[[recipiente]]
id = "pocillo_24"
nombre = "Pocillo de placa de 24"
area_cm2 = 1.9
volumen_ml = 0.5

[[recipiente]]
id = "pocillo_96"
nombre = "Pocillo de placa de 96"
area_cm2 = 0.32
volumen_ml = 0.1

[[recipiente]]
id = "frasco_t25"
nombre = "Frasco T-25"
area_cm2 = 25.0
volumen_ml = 5.0

# Portaobjetos con cubreobjetos de 22 × 22 mm sobre una gota de ~10 µL: una capa de ~20 µm.
[[recipiente]]
id = "portaobjetos"
nombre = "Portaobjetos con cubreobjetos de 22 mm"
area_cm2 = 4.84
volumen_ml = 0.01

# --- Recipientes de los cultivos bien mezclados (fase P1) -------------------------------------------

# Gause (1934, cap. V) cultivaba los paramecios en tubos chicos de fondo plano con 0,5 cm³ de medio.
# El diámetro del tubo (~1 cm) es una ESTIMACIÓN: fija la profundidad (~0,6 cm) y el intercambio de gases.
[[recipiente]]
id = "tubo_gause"
nombre = "Tubo de Gause (0,5 mL)"
area_cm2 = 0.8
volumen_ml = 0.5
fuente = "Gause, G. F. (1934). The Struggle for Existence, cap. V (0,5 cm3 por tubo); diámetro estimado."

[[recipiente]]
id = "erlenmeyer_250"
nombre = "Erlenmeyer de 250 mL (100 mL de medio)"
area_cm2 = 50.0
volumen_ml = 100.0
fuente = "Frasco de Erlenmeyer de 250 mL con 100 mL de medio (fondo de ~8 cm de diámetro)."

[[recipiente]]
id = "tubo_ensayo_10"
nombre = "Tubo de ensayo (10 mL)"
area_cm2 = 2.0
volumen_ml = 10.0
fuente = "Tubo de ensayo de 16 mm con 10 mL de medio."

# Cámara de un microquimiostato: los cultivos continuos en chips de microfluídica van de nanolitros a
# decenas de microlitros (Balagaddé et al. 2005, Science 309: 137-140, cámaras de 16 nL). Permite
# simular por individuo un quimiostato de algas con cientos de células.
[[recipiente]]
id = "microquimiostato"
nombre = "Cámara de microquimiostato (20 µL)"
area_cm2 = 0.04
volumen_ml = 0.02
fuente = "Microquimiostatos en chips de microfluídica: Balagaddé, F. K. et al. (2005). Science 309: 137-140 (cámaras de 16 nL); 20 µL es una cámara grande de ese tipo."

