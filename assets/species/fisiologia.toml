# Fisiología por especie (MVP: validación científica). Cada valor como se publicó: valor, unidad,
# temperatura de la medición [°C] y fuente. El programa lo lleva a 20 °C con Q10 = 2.
#
# Unidades: "1/h" o "1/dia" (tasa), "h" o "dia" (tiempo de duplicación).
# estimacion = true: no es una medición directa en condiciones comparables (temperatura sin
# verificar, otra cepa u otro medio); la ficha lo dice. REVISAR antes de publicar resultados.
# Las especies que no figuran usan el valor general del metabolismo (metabolismo.crecimiento_maximo).

version = 1

[Paramecium.crecimiento_maximo]
# Ajuste logístico (r) al monocultivo de P. caudatum de la fig. 22 (datos digitalizados en el paquete
# de R gauseR, Clark et al.): r = 0,946 ± 0,109 /día, K = 203 (volumen relativo). La figura mide
# volumen, no individuos.
valor = 0.946
unidad = "1/dia"
temperatura = 26.0
fuente = "Gause, G. F. (1934). The Struggle for Existence. Williams & Wilkins, fig. 22 (P. caudatum en monocultivo). Temperatura del cultivo sin verificar (se asume 26 °C)."
estimacion = true

